<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>係數總覽 + 動靜總覽 試做</title>
<style>
  :root{--text:#3d3b39;--text3:#9a9188;--bg:#f7f4ef;--card:#fffdfa;--border:#e7ded2;--static:#7A9E7E;--active:#C17A5A}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);font-family:'Noto Sans TC','PingFang TC',sans-serif;color:var(--text);padding:14px}
  .wrap{max-width:480px;margin:0 auto}
  .sub{font-size:12px;color:var(--text3);text-align:center;margin-bottom:10px;line-height:1.6}
  .card{background:#fff;border:1px solid var(--border);border-radius:12px;padding:8px;box-shadow:0 1px 4px rgba(0,0,0,0.04)}
  svg{display:block;width:100%;height:auto;cursor:move}
  .ctrl{margin-top:10px}
  .ctrl .row{display:flex;align-items:center;gap:8px;margin-bottom:6px;font-size:13px;flex-wrap:wrap}
  textarea{width:100%;height:48px;font-family:monospace;font-size:11px;border:1px solid var(--border);border-radius:8px;padding:6px;background:var(--card);color:var(--text)}
  button{padding:6px 14px;border:1px solid var(--border);border-radius:8px;background:var(--card);font-size:13px;cursor:pointer}
</style>
</head>
<body>
<div class="wrap">
  <div class="sub">（案例數據；假）上：係數總覽（子彈圖）／下：動靜總覽（逐部位）</div>
  <div class="card">
    <svg id="chart" viewBox="0 0 400 420" aria-label="係數總覽圖"></svg>
  </div>
  <div class="ctrl">
    <div style="font-size:12px;color:var(--text3);margin-bottom:4px">拖圖移動；下方滑桿調整</div>
    <div class="row">bar 粗細 <input id="hS" type="range" min="6" max="24" step="1" value="10" style="width:130px"> <b id="hV">10</b>
      ｜ 軸長 <input id="wS" type="range" min="180" max="320" step="5" value="300" style="width:130px"> <b id="wV">300</b></div>
    <div class="row">係數濃度 <input id="cS" type="range" min="0.2" max="1" step="0.05" value="0.7" style="width:130px"> <b id="cV">0.70</b>
      ｜ 動靜濃度 <input id="sS" type="range" min="0.2" max="1" step="0.05" value="0.8" style="width:130px"> <b id="sV">0.80</b></div>
    <textarea id="out" readonly></textarea>
    <div style="margin-top:6px"><button id="copyBtn">複製設定</button> <button id="resetBtn">歸位</button></div>
  </div>
</div>
<script>
const STUDENT='學員姓名';
const DIMS_C=[0.13,0.29,0.80,0.00,0.29,0.50,0.50,0.29,0.80,0.80,0.50,0.50,0.13];
const mean=a=>a.reduce((s,x)=>s+x,0)/a.length;
const bossV=mean(DIMS_C.slice(0,3)),mgrV=mean(DIMS_C.slice(3,6)),preV=mean(DIMS_C.slice(0,6)),
      luckV=mean(DIMS_C.slice(6,9)),postV=mean(DIMS_C.slice(9,13)),totV=mean(DIMS_C);
const A='#C17A5A', S='#7A9E7E', TOTCOL='#494541';
const ROWS=[
  {name:'先天',v:preV,col:'#8E4B50'},{name:'老闆',v:bossV,col:'#936A78'},{name:'主管',v:mgrV,col:'#876D4F'},
  {name:'運氣',v:luckV,col:'#546D77'},{name:'後天',v:postV,col:'#797181'},{name:'總係數',v:totV,col:TOTCOL}
];
// 動靜總覽：逐部位「動」數（部位總和=13）
const PARTS=[{name:'頭',d:7},{name:'上停',d:4},{name:'中停',d:8},{name:'下停',d:3},{name:'耳',d:6},{name:'眉',d:8},{name:'眼',d:2},{name:'鼻',d:9},{name:'口',d:5}];
PARTS.forEach(p=>p.s=13-p.d);
const pTotD=PARTS.reduce((a,p)=>a+p.d,0), pTotS=PARTS.reduce((a,p)=>a+p.s,0);
const SD_ROWS=PARTS.map(p=>({name:p.name,d:p.d,s:p.s,t:13})).concat([{name:'總計',d:pTotD,s:pTotS,t:pTotD+pTotS}]);
const THICK_AFTER=[3,8];

let BAR_H=10, TRACKW=300, COEF_OP=0.7, SD_OP=0.8, TX=0, TY=0;
const CMAX=0.8, X0=74, GAP=9.6, PAD=8, LP=4, SDG_THIN=2.5, SDG_THICK=8;
const chart=document.getElementById('chart');
function barR(x,y,w,h,r){w=Math.max(0,w);r=Math.max(0,Math.min(r,h/2,w));return `M${x.toFixed(1)},${y.toFixed(1)} h${(w-r).toFixed(1)} a${r},${r} 0 0 1 ${r},${r} v${(h-2*r).toFixed(1)} a${r},${r} 0 0 1 ${-r},${r} h${(-(w-r)).toFixed(1)} Z`;}
function barL(x,y,w,h,r){w=Math.max(0,w);r=Math.max(0,Math.min(r,h/2,w));return `M${(x+r).toFixed(1)},${y.toFixed(1)} h${(w-r).toFixed(1)} v${h.toFixed(1)} h${(-(w-r)).toFixed(1)} a${r},${r} 0 0 1 ${-r},${-r} v${(-(h-2*r)).toFixed(1)} a${r},${r} 0 0 1 ${r},${-r} Z`;}

function render(){
  const xOf=v=>X0+(Math.min(1,v/CMAX))*TRACKW;
  let s=`<g id="bg" transform="translate(${TX},${TY})">`;
  // 標題：左上姓名、右上 人相兵法係數總覽
  s+=`<text x="${X0}" y="20" font-size="11.5" text-anchor="start" fill="#9a9188" font-weight="600">${STUDENT}</text>`;
  s+=`<text x="${(X0+TRACKW).toFixed(1)}" y="20" font-size="14" text-anchor="end" fill="#3d3b39" font-weight="700" letter-spacing="1">人相兵法係數總覽</text>`;
  // ===== 係數總覽（6 bullet bars）=====
  const n=ROWS.length, cTop=34, stackTop=cTop+PAD, stackBot=stackTop+n*(BAR_H+GAP)-GAP, cBot=stackBot+PAD;
  const tEdge=xOf(totV);
  s+=`<rect x="${X0}" y="${cTop}" width="${TRACKW}" height="${(cBot-cTop).toFixed(1)}" rx="4" fill="#f3eee4"/>`;
  ROWS.forEach((r,i)=>{const y=stackTop+i*(BAR_H+GAP);const cyy=y+BAR_H/2;
    s+=`<path d="${barR(X0,y,xOf(r.v)-X0,BAR_H,Math.min(3,BAR_H/2))}" fill="${r.col}" fill-opacity="${COEF_OP}"/>`;
    s+=`<text x="${(X0-8).toFixed(1)}" y="${cyy.toFixed(1)}" font-size="12" text-anchor="end" dominant-baseline="central" fill="${r.col}" font-weight="700">${r.name}</text>`;
    s+=`<text x="${(xOf(r.v)+6).toFixed(1)}" y="${cyy.toFixed(1)}" font-size="11" dominant-baseline="central" fill="${r.col}" font-family="'Helvetica Neue',Arial,sans-serif" font-weight="700">${r.v.toFixed(2)}</text>`;});
  s+=`<line x1="${tEdge.toFixed(1)}" y1="${(cTop-LP).toFixed(1)}" x2="${tEdge.toFixed(1)}" y2="${(cBot+LP).toFixed(1)}" stroke="${TOTCOL}" stroke-width="1.5"/>`;
  // ===== 動靜總覽（逐部位：動左/靜右，兩端圓角；高度/間隔同係數；米白底）=====
  const SDH=BAR_H, GT=GAP, GK=GAP+6, prr=Math.min(3,SDH/2);
  // 「總動靜」標題：右對齊、同上方標題色；與上下米白紙各留一個 bar 間隔(GAP)
  const headBoxTop=cBot+GAP, headBase=headBoxTop+12, sdCTop=headBoxTop+16+GAP, barsTop=sdCTop+PAD;
  let hh=0; SD_ROWS.forEach((r,i)=>{hh+=SDH; if(i<SD_ROWS.length-1) hh+=(THICK_AFTER.indexOf(i)>=0?GK:GT);});
  s+=`<text x="${(X0+TRACKW).toFixed(1)}" y="${headBase.toFixed(1)}" font-size="14" text-anchor="end" fill="#3d3b39" font-weight="700" letter-spacing="1">總動靜</text>`;
  s+=`<rect x="${X0}" y="${sdCTop.toFixed(1)}" width="${TRACKW}" height="${(hh+2*PAD).toFixed(1)}" rx="4" fill="#f3eee4"/>`;
  let y=barsTop;
  SD_ROWS.forEach((r,i)=>{const isTot=(i===SD_ROWS.length-1);const op=isTot?Math.min(1,SD_OP+0.18):SD_OP;
    const dW=TRACKW*r.d/r.t, bd=X0+dW, cyy=y+SDH/2;
    s+=`<path d="${barL(X0,y,dW,SDH,prr)}" fill="${A}" fill-opacity="${op}"/>`;
    s+=`<path d="${barR(bd,y,TRACKW-dW,SDH,prr)}" fill="${S}" fill-opacity="${op}"/>`;
    s+=`<text x="${(X0-8).toFixed(1)}" y="${cyy.toFixed(1)}" font-size="11.5" text-anchor="end" dominant-baseline="central" fill="#6a6458" font-weight="700">${r.name}</text>`;
    if(dW>10) s+=`<text x="${(bd-4).toFixed(1)}" y="${cyy.toFixed(1)}" font-size="10" text-anchor="end" dominant-baseline="central" fill="#fff" font-weight="700">${r.d}</text>`;
    if(TRACKW-dW>10) s+=`<text x="${(bd+4).toFixed(1)}" y="${cyy.toFixed(1)}" font-size="10" text-anchor="start" dominant-baseline="central" fill="#fff" font-weight="700">${r.s}</text>`;
    const gp=(i<SD_ROWS.length-1?(THICK_AFTER.indexOf(i)>=0?GK:GT):0);
    if(THICK_AFTER.indexOf(i)>=0){const ly=y+SDH+gp/2;s+=`<line x1="${X0}" y1="${ly.toFixed(1)}" x2="${(X0+TRACKW).toFixed(1)}" y2="${ly.toFixed(1)}" stroke="#b09a6a" stroke-width="1.2"/>`;}
    y+=SDH+gp;
  });
  s+='</g>';
  chart.innerHTML=s;
  readout();
}
function readout(){document.getElementById('out').value=`bar粗細=${BAR_H} 軸長=${TRACKW} 係數濃度=${COEF_OP} 動靜濃度=${SD_OP}\n位置 x=${TX.toFixed(0)} y=${TY.toFixed(0)}`;}
// 拖曳移動
(function(){
  let drag=false,sx,sy,bx,by;
  function toSvg(e){const pt=chart.createSVGPoint();const t=e.touches?e.touches[0]:e;pt.x=t.clientX;pt.y=t.clientY;return pt.matrixTransform(chart.getScreenCTM().inverse());}
  function down(e){e.preventDefault();drag=true;const p=toSvg(e);sx=p.x;sy=p.y;bx=TX;by=TY;}
  function move(e){if(!drag)return;e.preventDefault();const p=toSvg(e);TX=bx+(p.x-sx);TY=by+(p.y-sy);const g=document.getElementById('bg');if(g)g.setAttribute('transform',`translate(${TX.toFixed(1)},${TY.toFixed(1)})`);readout();}
  function up(){drag=false;}
  chart.addEventListener('mousedown',down);chart.addEventListener('touchstart',down,{passive:false});
  window.addEventListener('mousemove',move);window.addEventListener('touchmove',move,{passive:false});
  window.addEventListener('mouseup',up);window.addEventListener('touchend',up);
})();
const hS=document.getElementById('hS'),hV=document.getElementById('hV');
hS.addEventListener('input',function(){BAR_H=parseInt(this.value,10);hV.textContent=BAR_H;render();});
const wS=document.getElementById('wS'),wV=document.getElementById('wV');
wS.addEventListener('input',function(){TRACKW=parseInt(this.value,10);wV.textContent=TRACKW;render();});
const cS=document.getElementById('cS'),cV=document.getElementById('cV');
cS.addEventListener('input',function(){COEF_OP=parseFloat(this.value);cV.textContent=COEF_OP.toFixed(2);render();});
const sS=document.getElementById('sS'),sV=document.getElementById('sV');
sS.addEventListener('input',function(){SD_OP=parseFloat(this.value);sV.textContent=SD_OP.toFixed(2);render();});
document.getElementById('copyBtn').addEventListener('click',function(){const ta=document.getElementById('out');ta.select();try{document.execCommand('copy');}catch(e){}this.textContent='已複製';const b=this;setTimeout(()=>b.textContent='複製設定',1200);});
document.getElementById('resetBtn').addEventListener('click',function(){BAR_H=10;TRACKW=300;COEF_OP=0.7;SD_OP=0.8;TX=0;TY=0;hS.value=10;hV.textContent=10;wS.value=300;wV.textContent=300;cS.value=0.7;cV.textContent='0.70';sS.value=0.8;sV.textContent='0.80';render();});
render();
</script>
</body>
</html>
