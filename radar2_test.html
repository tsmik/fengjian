<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>係數雷達圖 試做</title>
<style>
  :root{--static:#7A9E7E;--active:#C17A5A;--text:#3d3b39;--text3:#9a9188;--bg:#f7f4ef;--card:#fffdfa;--border:#e7ded2;
        --cream-deep:#cdb892;--cream-bg:#f0e9dc;--cream-text:#7d6643}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);font-family:'Noto Sans TC','PingFang TC',sans-serif;color:var(--text);padding:14px}
  .wrap{max-width:460px;margin:0 auto}
  .title{font-size:18px;font-weight:700;letter-spacing:2px;text-align:center;margin:4px 0 2px}
  .sub{font-size:12px;color:var(--text3);text-align:center;margin-bottom:10px;line-height:1.6}
  .card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:8px;box-shadow:0 1px 4px rgba(0,0,0,0.04)}
  svg{display:block;width:100%;height:auto}
  .legend{display:flex;gap:18px;justify-content:center;font-size:12px;color:var(--text3);margin-top:4px}
  .legend i{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:5px;vertical-align:-1px}
</style>
</head>
<body>
<div class="wrap">
  <div class="sub">（案例數據；係數為假）放射長度＝係數(coeff/0.8)；bar 灰色，最外緣線依動靜上色</div>
  <div class="card">
    <svg id="poly" viewBox="0 -34 400 458" aria-label="一目了然圖"></svg>
  </div>
  <div style="margin-top:10px">
    <div style="font-size:12px;color:var(--text3);margin-bottom:4px">拖曳模式（含外圍 13 個維度字）：拖字身＝移位置；拖右下角小圓點＝縮放大小。下方即時顯示座標與字級</div>
    <div style="margin-bottom:6px;font-size:13px;color:var(--text)">扇形濃度 <b id="opVal">0.30</b> <input id="opSlider" type="range" min="0" max="1" step="0.05" value="0.3" style="vertical-align:middle;width:150px"> ｜ 先天濃度 <b id="preVal">0.30</b> <input id="preSlider" type="range" min="0" max="1" step="0.05" value="0.3" style="vertical-align:middle;width:150px"></div>
    <div style="margin-bottom:6px;font-size:13px;color:var(--text)">老闆/主管輪廓濃度 <b id="qlVal">0.80</b> <input id="qlSlider" type="range" min="0" max="1" step="0.05" value="0.8" style="vertical-align:middle;width:180px"></div>
    <div style="margin-bottom:6px;font-size:13px;color:var(--text)">bar 低分濃 <b id="loV">1.00</b> <input id="loS" type="range" min="0" max="1" step="0.05" value="1" style="vertical-align:middle;width:140px"> ｜ 高分淡 <b id="hiV">0.70</b> <input id="hiS" type="range" min="0" max="1" step="0.05" value="0.7" style="vertical-align:middle;width:140px"></div>
    <textarea id="coords" readonly style="width:100%;height:120px;font-family:monospace;font-size:11px;border:1px solid var(--border);border-radius:8px;padding:6px;background:var(--card);color:var(--text)"></textarea>
    <button id="copyBtn" style="margin-top:6px;padding:6px 14px;border:1px solid var(--border);border-radius:8px;background:var(--card);font-size:13px;cursor:pointer">複製座標</button>
    <button id="resetBtn" style="margin-top:6px;margin-left:6px;padding:6px 14px;border:1px solid var(--border);border-radius:8px;background:var(--card);font-size:13px;cursor:pointer">歸位</button>
  </div>
</div>
<script>
function getC(v){return getComputedStyle(document.documentElement).getPropertyValue(v).trim();}
const S=getC('--static'),A=getC('--active');
const CRD=getC('--cream-deep'),CRBG=getC('--cream-bg'),CRT=getC('--cream-text');
const Sm='#90b094', Am='#cc9173', Sd='#4f6f53', Ad='#8f5236';
const DIMS=[
  {dn:'形勢',j:5,c:0.13,jc:'形',dc:'勢'},{dn:'經緯',j:1,c:0.29,jc:'經',dc:'緯'},{dn:'方圓',j:3,c:0.80,jc:'方',dc:'圓'},
  {dn:'曲直',j:0,c:0.00,jc:'直',dc:'曲'},{dn:'收放',j:5,c:0.29,jc:'收',dc:'放'},{dn:'緩急',j:5,c:0.50,jc:'緩',dc:'急'},
  {dn:'順逆',j:7,c:0.50,jc:'順',dc:'逆'},{dn:'分合',j:3,c:0.29,jc:'合',dc:'分'},{dn:'真假',j:9,c:0.80,jc:'真',dc:'假'},
  {dn:'攻守',j:0,c:0.80,jc:'守',dc:'攻'},{dn:'奇正',j:4,c:0.50,jc:'正',dc:'奇'},{dn:'虛實',j:3,c:0.50,jc:'實',dc:'虛'},{dn:'進退',j:2,c:0.13,jc:'退',dc:'進'}
];
DIMS.forEach(d=>d.d=9-d.j);
// 維度專屬顏色（取自兵法報告 dimText）
const DIMTXT=['#4A6B3A','#3A5E54','#6A6458','#7A5A38','#7A4858','#7A6A38','#3A5A7A','#5A4870','#3A6A4A','#3A6B3A','#5A4068','#3A6058','#3A5870'];
const STEP=360/13;
const spans=[];for(let i=0;i<13;i++)spans.push([i*STEP,(i+1)*STEP]);
const mean=a=>a.reduce((s,x)=>s+x,0)/a.length, co=DIMS.map(d=>d.c);
const CORE=[
  {name:'先天',a0:0,a1:6*STEP,v:mean(co.slice(0,6))},
  {name:'運氣',a0:6*STEP,a1:9*STEP,v:mean(co.slice(6,9))},
  {name:'後天',a0:9*STEP,a1:360,v:mean(co.slice(9,13))}
];
const COEF_MAX=0.8;
const cx=200,cy=215,U=150/9,rIn=4*U,rOut=9*U,H=rOut-rIn,rBal=rIn+0.5*H;
const rad=d=>d*Math.PI/180;
const f=(deg,r)=>[cx+r*Math.sin(rad(deg)),cy-r*Math.cos(rad(deg))];
const PS=p=>p[0].toFixed(2)+','+p[1].toFixed(2);
const facet=(a0,a1,ra,rb)=>`M ${PS(f(a0,ra))} L ${PS(f(a0,rb))} L ${PS(f(a1,rb))} L ${PS(f(a1,ra))} Z`;
function sector(a0,a1,r){const l=(a1-a0)>180?1:0;return `M${cx},${cy} L${PS(f(a0,r))} A${r.toFixed(1)},${r.toFixed(1)} 0 ${l} 1 ${PS(f(a1,r))} Z`;}
// 多邊形扇形：中心 → 沿維度交界各頂點（同半徑）→ 回中心
function polySector(a0,a1,r){const k0=Math.round(a0/STEP),k1=Math.round(a1/STEP);let pts=[`${cx},${cy}`];for(let k=k0;k<=k1;k++)pts.push(PS(f(k*STEP,r)));return 'M'+pts.join(' L')+' Z';}
// 只取外緣折線（不含往中心的兩條邊）
function polyArc(a0,a1,r){const k0=Math.round(a0/STEP),k1=Math.round(a1/STEP);let pts=[];for(let k=k0;k<=k1;k++)pts.push(PS(f(k*STEP,r)));return 'M'+pts.join(' L');}
// 內圈邊界 13 邊多邊形頂點
const innerPoly=spans.map(s=>PS(f(s[0],rIn))).join(' ');
let svg='';
// ===== 核心：四象限面積（老闆/主管/運氣/後天）=====
const bossV=mean(co.slice(0,3)), mgrV=mean(co.slice(3,6)), preV=CORE[0].v;
const QUAD=[
  {name:'老闆',a0:0,a1:3*STEP,v:bossV,bd:26.7,bf:0.731,bs:10.5,col:'#936A78',tc:'#936A78'},
  {name:'主管',a0:3*STEP,a1:6*STEP,v:mgrV,bd:140.0,bf:0.763,bs:10.5,col:'#AE6D4F',tc:'#876D4F'},
  {name:'運氣',a0:6*STEP,a1:9*STEP,v:CORE[1].v,bd:207.6,bf:0.767,bs:10.5,col:'#546D77',tc:'#546D77'},
  {name:'後天',a0:9*STEP,a1:360,v:CORE[2].v,bd:302.1,bf:0.770,bs:10.5,col:'#797181',tc:'#797181'}
];
svg+=`<polygon points="${innerPoly}" fill="${CRBG}"/>`;
// 運氣/後天 填色扇形
QUAD.forEach((q,qi)=>{if(qi<2)return;const r=rIn*Math.sqrt(Math.min(1,q.v/COEF_MAX));svg+=`<path class="qsec" d="${polySector(q.a0,q.a1,r)}" fill="${q.col}" fill-opacity="0.3"/>`;});
// 先天：多邊扇形（0~6格，覆蓋老闆+主管），濃度可調
{const rpre=rIn*Math.sqrt(Math.min(1,preV/COEF_MAX));svg+=`<path class="presec" d="${polySector(0,6*STEP,rpre)}" fill="#854F51" fill-opacity="0.30"/>`;}
// 老闆/主管：只留外輪廓線（疊在先天之上），透明0.8 可調
QUAD.forEach((q,qi)=>{if(qi>=2)return;const r=rIn*Math.sqrt(Math.min(1,q.v/COEF_MAX));svg+=`<path class="qline" d="${polyArc(q.a0,q.a1,r)}" fill="none" stroke="${q.col}" stroke-opacity="0.8" stroke-width="1.5" stroke-linejoin="round"/>`;});
// 係數間白色分隔線（老闆|主管=先天內部切分，透明0.4；其餘實白）
[[0,1],[3*STEP,0.4],[6*STEP,1],[9*STEP,1]].forEach(([a,op])=>{const p=f(a,rIn);svg+=`<line x1="${cx}" y1="${cy}" x2="${p[0].toFixed(1)}" y2="${p[1].toFixed(1)}" stroke="#fff" stroke-opacity="${op}" stroke-width="1.5"/>`;});
svg+=`<polygon points="${innerPoly}" fill="none" stroke="#fff" stroke-width="1.5"/>`;
// 文字框（可拖曳）：LABELS 記錄每個框的原始座標供讀數
const LABELS=[];
function lab2(x,y,name,val,fs,key,col){fs=fs||9;key=key||name;col=col||CRT;const tl=(name.length*fs).toFixed(1);const hw=name.length*fs/2;LABELS.push({key,x,y,fs});svg+=`<g class="drg" data-key="${key}">`+`<text x="${x.toFixed(1)}" y="${(y-3).toFixed(1)}" font-size="${fs}" text-anchor="middle" fill="${col}" font-weight="700">${name}</text>`+`<text x="${x.toFixed(1)}" y="${(y+9).toFixed(1)}" font-size="${fs}" textLength="${tl}" lengthAdjust="spacingAndGlyphs" text-anchor="middle" fill="${col}" font-family="'Helvetica Neue',Arial,sans-serif" font-weight="700">${val.toFixed(2)}</text>`+`<circle class="rsz" data-key="${key}" cx="${(x+hw+4).toFixed(1)}" cy="${(y+11).toFixed(1)}" r="3.2" fill="#cc9173" stroke="#fff" stroke-width="0.8"/>`+`</g>`;}
QUAD.forEach(q=>{const p=f(q.bd,rIn*q.bf);lab2(p[0],p[1],q.name,q.v,q.bs,q.name,q.tc);});
// 係數環：bar 由 rIn 放射，長度 ∝ 係數；底色＝動/靜色，透明度與分數反比(低分濃/高分淡)
let OP_LOW=1.00, OP_HIGH=0.70;
DIMS.forEach((dm,i)=>{const[a0,a1]=spans[i];const frac=Math.min(1,dm.c/COEF_MAX);const rT=rIn+frac*H;
  const fill=dm.d>dm.j?A:S;const op=(OP_LOW*(1-frac)+OP_HIGH*frac).toFixed(3);
  svg+=`<path class="cbar" data-frac="${frac.toFixed(3)}" d="${facet(a0,a1,rIn,rT)}" fill="${fill}" fill-opacity="${op}" stroke="#fff" stroke-width="0.8"/>`;});
// 先天/運氣/後天 群組分隔線（由中心延伸到外緣）：0格老闆色 / 6格運氣色 / 9格後天色
[[0,'#936A78',1],[3*STEP,'#898179',0.5],[6*STEP,'#546D77',1],[9*STEP,'#797181',1]].forEach(([a,col,op])=>{const p1=f(a,rOut);svg+=`<line x1="${cx}" y1="${cy}" x2="${p1[0].toFixed(1)}" y2="${p1[1].toFixed(1)}" stroke="${col}" stroke-opacity="${op}" stroke-width="2"/>`;});
// 最外圍淡灰 13 邊形
svg+=`<polygon points="${spans.map(s=>PS(f(s[0],rOut))).join(' ')}" fill="none" stroke="#e6ddd0" stroke-width="1"/>`;
// 維度名：13邊形外（僅名稱，可拖曳）
const FSD=10.8;
const NAMEPOS=[[14.1,2.395],[40.3,2.320],[69.1,2.318],[97.2,2.300],[128.5,2.340],[155.9,2.401],[180.0,2.504],[204.4,2.406],[233.7,2.390],[261.9,2.332],[290.2,2.365],[319.1,2.357],[345.6,2.398]];
DIMS.forEach((dm,i)=>{const np2=NAMEPOS[i];const lp=f(np2[0],rIn*np2[1]);const c=Math.sin(rad(np2[0]));const an=c>0.25?'start':c<-0.25?'end':'middle';const col=DIMTXT[i];const key=dm.dn;
  const w=dm.dn.length*FSD;const hx=an==='start'?lp[0]+w+4:an==='end'?lp[0]+4:lp[0]+w/2+4;
  LABELS.push({key,x:lp[0],y:lp[1],fs:FSD});
  svg+=`<g class="drg" data-key="${key}">`
     +`<text x="${lp[0].toFixed(1)}" y="${lp[1].toFixed(1)}" font-size="${FSD}" text-anchor="${an}" fill="${col}" fill-opacity="0.8" font-weight="600">${dm.dn}</text>`
     +`<circle class="rsz" data-key="${key}" cx="${hx.toFixed(1)}" cy="${(lp[1]+1).toFixed(1)}" r="3.0" fill="#cc9173" stroke="#fff" stroke-width="0.8"/>`
     +`</g>`;});
// 維度係數數字：位置寫死(仍可拖曳)；在 bar 內(<=rT)→白字，在 bar 外→動/靜色
const NUMPOS=[[13.8,1.975],[42.6,1.921],[70.4,1.925],[98.2,1.940],[126.6,1.985],[152.6,2.047],[180.0,2.083],[207.4,2.047],[234.3,2.028],[261.2,1.985],[289.7,1.956],[317.6,1.950],[345.6,1.952]];
DIMS.forEach((dm,i)=>{const rT=rIn+Math.min(1,dm.c/COEF_MAX)*H;const npp=f(NUMPOS[i][0],rIn*NUMPOS[i][1]);const nx=npp[0],ny=npp[1];
  const rr=Math.hypot(nx-cx,ny-cy);const mcol=dm.d>dm.j?A:S;const ncol=(rT>=rr)?'#fff':mcol;const key='數'+dm.dn;
  LABELS.push({key,x:nx,y:ny,fs:10.5});
  svg+=`<g class="drg numlab" data-key="${key}" data-rt="${rT.toFixed(1)}" data-mcol="${mcol}">`
     +`<text class="numtxt" x="${nx.toFixed(1)}" y="${ny.toFixed(1)}" font-size="10.5" text-anchor="middle" fill="${ncol}" font-family="'Helvetica Neue',Arial,sans-serif" font-weight="700">${dm.c.toFixed(2)}</text>`
     +`<circle class="rsz" data-key="${key}" cx="${(nx+12).toFixed(1)}" cy="${ny.toFixed(1)}" r="3.0" fill="#cc9173" stroke="#fff" stroke-width="0.8"/>`
     +`</g>`;});
// 先天框（字框同運氣 fs10.5、色 #854F51；可拖曳）
{const p=f(88.3,rIn*0.770);lab2(p[0],p[1],'先天',preV,10.5,'先天','#854F51');}
// 總係數（中央 13 邊形 #494541 白字；數字字級同運氣 10.5；可拖曳）
{const tcx=cx,tcy=cy,totV=mean(co);LABELS.push({key:'總係數',x:tcx,y:tcy,fs:10.5});
 const tg=spans.map(s=>PS(f(s[0],22))).join(' ');
 svg+=`<g class="drg" data-key="總係數">`
   +`<polygon points="${tg}" fill="#494541" fill-opacity="0.92"/>`
   +`<text x="${tcx}" y="${(tcy-3).toFixed(1)}" font-size="9" text-anchor="middle" fill="#fff">總係數</text>`
   +`<text x="${tcx}" y="${(tcy+9).toFixed(1)}" font-size="10.5" textLength="21" lengthAdjust="spacingAndGlyphs" text-anchor="middle" fill="#fff" font-family="'Helvetica Neue',Arial,sans-serif">${totV.toFixed(2)}</text>`
   +`<circle class="rsz" data-key="總係數" cx="${(tcx+22).toFixed(1)}" cy="${(tcy+15).toFixed(1)}" r="3.2" fill="#cc9173" stroke="#fff" stroke-width="0.8"/>`
   +`</g>`;}
// 學員姓名（輸出時顯示在標題上方；目前為佔位字，之後接真實姓名）
{const p=f(322.8,rIn*3.596);const nx=p[0],ny=p[1];LABELS.push({key:'姓名',x:nx,y:ny,fs:13.5});
 svg+=`<g class="drg" data-key="姓名">`
   +`<text x="${nx.toFixed(1)}" y="${ny.toFixed(1)}" font-size="13.5" text-anchor="middle" fill="var(--text3)" font-weight="600">學員姓名</text>`
   +`<circle class="rsz" data-key="姓名" cx="${(nx+40).toFixed(1)}" cy="${(ny+4).toFixed(1)}" r="3.2" fill="#cc9173" stroke="#fff" stroke-width="0.8"/>`
   +`</g>`;}
// 標題（可拖曳/縮放）
{const p=f(31.6,rIn*3.395);const tx=p[0],ty=p[1];LABELS.push({key:'標題',x:tx,y:ty,fs:13.6});
 svg+=`<g class="drg" data-key="標題">`
   +`<text x="${tx.toFixed(1)}" y="${ty.toFixed(1)}" font-size="13.6" text-anchor="middle" fill="var(--text)" font-weight="700" letter-spacing="2">人相兵法報告圖</text>`
   +`<circle class="rsz" data-key="標題" cx="${(tx+55).toFixed(1)}" cy="${(ty+4).toFixed(1)}" r="3.2" fill="#cc9173" stroke="#fff" stroke-width="0.8"/>`
   +`</g>`;}
// 動靜圖例（可拖曳/縮放）
{const p=f(221.2,rIn*3.773);const lx=p[0],ly=p[1];const ls=10/12,fz=12*ls;LABELS.push({key:'圖例',x:lx,y:ly,fs:fz});
 svg+=`<g class="drg" data-key="圖例">`
   +`<rect x="${lx.toFixed(1)}" y="${(ly-9*ls).toFixed(1)}" width="${(11*ls).toFixed(1)}" height="${(11*ls).toFixed(1)}" rx="2" fill="${S}"/>`
   +`<text x="${(lx+15*ls).toFixed(1)}" y="${ly.toFixed(1)}" font-size="${fz.toFixed(1)}" fill="var(--text3)">靜</text>`
   +`<rect x="${(lx+40*ls).toFixed(1)}" y="${(ly-9*ls).toFixed(1)}" width="${(11*ls).toFixed(1)}" height="${(11*ls).toFixed(1)}" rx="2" fill="${A}"/>`
   +`<text x="${(lx+55*ls).toFixed(1)}" y="${ly.toFixed(1)}" font-size="${fz.toFixed(1)}" fill="var(--text3)">動</text>`
   +`<circle class="rsz" data-key="圖例" cx="${(lx+72*ls).toFixed(1)}" cy="${(ly+4).toFixed(1)}" r="3.2" fill="#cc9173" stroke="#fff" stroke-width="0.8"/>`
   +`</g>`;}
const poly=document.getElementById('poly');
poly.innerHTML=svg;
// ===== 拖曳調框位置/大小 + 座標讀數 =====
(function(){
  const off={};const L4=k=>LABELS.find(l=>l.key===k);
  function getO(k){if(!off[k])off[k]={tx:0,ty:0,s:1};return off[k];}
  function toSvg(e){const pt=poly.createSVGPoint();const t=e.touches?e.touches[0]:e;pt.x=t.clientX;pt.y=t.clientY;return pt.matrixTransform(poly.getScreenCTM().inverse());}
  function applyT(k){const o=getO(k),L=L4(k),g=poly.querySelector(`.drg[data-key="${CSS.escape(k)}"]`);g.setAttribute('transform',`translate(${o.tx.toFixed(1)},${o.ty.toFixed(1)}) translate(${L.x.toFixed(1)},${L.y.toFixed(1)}) scale(${o.s.toFixed(3)}) translate(${(-L.x).toFixed(1)},${(-L.y).toFixed(1)})`);}
  function readout(){
    document.getElementById('coords').value=LABELS.map(L=>{const o=getO(L.key);const X=L.x+o.tx,Y=L.y+o.ty;const dx=X-cx,dy=Y-cy;let deg=Math.atan2(dx,-dy)*180/Math.PI;if(deg<0)deg+=360;const r=Math.hypot(dx,dy);const fz=(L.fs*o.s).toFixed(1);return `${L.key}: f(${deg.toFixed(1)}, rIn*${(r/rIn).toFixed(3)})  fs=${fz}  scale=${o.s.toFixed(2)}`;}).join('\n');
  }
  let mode=null,key=null,start=null,base=null,anchor=null,d0=0;
  function downMove(e){e.preventDefault();mode='move';key=e.currentTarget.dataset.key;const o=getO(key);const p=toSvg(e);start={x:p.x,y:p.y};base={tx:o.tx,ty:o.ty};}
  function downResize(e){e.preventDefault();e.stopPropagation();mode='resize';key=e.currentTarget.dataset.key;const o=getO(key),L=L4(key);anchor={x:L.x+o.tx,y:L.y+o.ty};const p=toSvg(e);d0=Math.max(2,Math.hypot(p.x-anchor.x,p.y-anchor.y));base={s:o.s};}
  function move(e){if(!mode)return;e.preventDefault();const p=toSvg(e),o=getO(key);
    if(mode==='move'){o.tx=base.tx+(p.x-start.x);o.ty=base.ty+(p.y-start.y);}
    else{const d=Math.hypot(p.x-anchor.x,p.y-anchor.y);o.s=Math.min(3,Math.max(0.4,base.s*d/d0));}
    applyT(key);
    const g=poly.querySelector(`.drg[data-key="${CSS.escape(key)}"]`);
    if(g&&g.classList.contains('numlab')){const L=L4(key);const rr=Math.hypot((L.x+o.tx)-cx,(L.y+o.ty)-cy);const t=g.querySelector('.numtxt');if(t)t.setAttribute('fill', rr<=parseFloat(g.dataset.rt)?'#fff':g.dataset.mcol);}
    readout();}
  function up(){mode=null;}
  poly.querySelectorAll('.drg').forEach(g=>{g.style.cursor='move';g.addEventListener('mousedown',downMove);g.addEventListener('touchstart',downMove,{passive:false});});
  poly.querySelectorAll('.rsz').forEach(h=>{h.style.cursor='nwse-resize';h.addEventListener('mousedown',downResize);h.addEventListener('touchstart',downResize,{passive:false});});
  window.addEventListener('mousemove',move);window.addEventListener('touchmove',move,{passive:false});
  window.addEventListener('mouseup',up);window.addEventListener('touchend',up);
  document.getElementById('copyBtn').addEventListener('click',function(){const ta=document.getElementById('coords');ta.select();try{document.execCommand('copy');}catch(e){}this.textContent='已複製';const b=this;setTimeout(()=>b.textContent='複製座標',1200);});
  document.getElementById('resetBtn').addEventListener('click',function(){for(const k in off)delete off[k];poly.querySelectorAll('.drg').forEach(g=>g.removeAttribute('transform'));readout();});
  const loS=document.getElementById('loS'),loV=document.getElementById('loV'),hiS=document.getElementById('hiS'),hiV=document.getElementById('hiV');
  function applyBarOp(){const lo=parseFloat(loS.value),hi=parseFloat(hiS.value);loV.textContent=lo.toFixed(2);hiV.textContent=hi.toFixed(2);poly.querySelectorAll('.cbar').forEach(p=>{const fr=parseFloat(p.dataset.frac);p.setAttribute('fill-opacity',(lo*(1-fr)+hi*fr).toFixed(3));});}
  loS.addEventListener('input',applyBarOp);hiS.addEventListener('input',applyBarOp);
  const opS=document.getElementById('opSlider'),opV=document.getElementById('opVal');
  opS.addEventListener('input',function(){const v=parseFloat(this.value);opV.textContent=v.toFixed(2);poly.querySelectorAll('.qsec').forEach(p=>p.setAttribute('fill-opacity',v));});
  const preS=document.getElementById('preSlider'),preVe=document.getElementById('preVal');
  preS.addEventListener('input',function(){const v=parseFloat(this.value);preVe.textContent=v.toFixed(2);poly.querySelectorAll('.presec').forEach(p=>p.setAttribute('fill-opacity',v));});
  const qlS=document.getElementById('qlSlider'),qlVe=document.getElementById('qlVal');
  qlS.addEventListener('input',function(){const v=parseFloat(this.value);qlVe.textContent=v.toFixed(2);poly.querySelectorAll('.qline').forEach(p=>p.setAttribute('stroke-opacity',v));});
  readout();
})();
</script>
