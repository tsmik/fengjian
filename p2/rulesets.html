<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>套裝管理 — admin2</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{ --bg:#f6f1e9; --panel:#fbf8f2; --bd:#e3d9c8; --bd2:#d8ccb6; --ink:#4a443b; --sub:#9a8f7d; --static:#7A9E7E; --dynamic:#C17A5A; --sel:#efe7d6; --accent:#3b6ea5; }
  *{box-sizing:border-box;}
  body{margin:0;font-family:"Noto Serif TC",serif;color:var(--ink);background:var(--bg);font-size:14px;}
  header{display:flex;align-items:center;gap:10px;padding:11px 16px;background:var(--panel);border-bottom:1px solid var(--bd2);position:sticky;top:0;z-index:5;flex-wrap:wrap;}
  header h1{font-size:17px;margin:0;font-weight:600;letter-spacing:.5px;}
  .grow{flex:1;}
  #status{font-size:12px;color:var(--sub);}
  .btn{font-family:inherit;border:1px solid var(--bd2);background:var(--panel);border-radius:8px;padding:6px 12px;cursor:pointer;font-size:13px;color:var(--ink);}
  .btn:hover{background:var(--sel);}
  .btn.primary{background:var(--static);color:#fff;border-color:var(--static);}
  .btn.sm{padding:4px 10px;font-size:12px;}
  .btn.xs{padding:2px 8px;font-size:12px;border-radius:6px;}
  .btn.danger{color:#a8503a;}
  .cols{display:flex;gap:18px;align-items:flex-start;padding:16px;}
  .col-left{flex:0 0 460px;max-width:48%;}
  .col-right{flex:1;min-width:0;border-left:1px solid var(--bd);padding-left:18px;position:sticky;top:60px;}
  @media(max-width:900px){.cols{flex-direction:column;}.col-left{max-width:none;flex:1;width:100%;}.col-right{border-left:none;padding-left:0;border-top:1px solid var(--bd);padding-top:14px;position:static;}}
  .an-title{font-size:15px;font-weight:600;margin-bottom:10px;}
  .an-ctrl{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:12px;}
  .an-ctrl select{font-family:inherit;font-size:13px;border:1px solid var(--bd2);border-radius:8px;padding:5px 8px;background:#fffdf9;max-width:170px;}
  .gran{font-size:13px;color:var(--ink);display:flex;align-items:center;gap:4px;margin-left:6px;}
  .diff-out{font-size:13px;line-height:1.7;}
  .ds{margin:0 0 16px;}
  .ds-head{font-weight:600;font-size:14px;border-bottom:1px solid var(--bd);padding-bottom:4px;margin-bottom:6px;}
  .ds-row{padding:3px 0;}
  .d-tag{font-weight:700;font-size:12px;border-radius:6px;padding:1px 6px;margin-right:4px;color:#fff;}
  .d-add .d-tag{background:var(--static);} .d-remove .d-tag{background:#b5573f;} .d-change .d-tag{background:var(--accent);}
  .d-detail{color:var(--sub);font-size:12px;padding-left:14px;}
  .more{cursor:pointer;color:var(--accent);font-size:13px;padding:6px 0;}
  .more:hover{text-decoration:underline;}
  .ov-rel{font-weight:600;}
  .active-line{font-size:13px;color:var(--sub);margin-bottom:10px;}
  .rs-card{border:1px solid var(--bd);border-radius:12px;background:var(--panel);padding:12px;margin:10px 0;box-shadow:0 1px 2px rgba(90,75,50,.05);}
  .rs-top{display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
  .f-period{font-family:inherit;font-size:13px;border:1px solid var(--bd2);border-radius:8px;padding:5px 8px;background:#fffdf9;}
  .lbl{font-size:12px;color:var(--sub);}
  /* 點文字才出現編輯框 */
  .inline-field{display:inline-block;}
  .inline-field.ml{flex:1;min-width:0;}
  .if-text{display:inline-block;cursor:text;padding:2px 6px;border-radius:6px;color:var(--ink);}
  .if-text:hover{background:var(--sel);}
  .if-text.empty{color:var(--sub);font-style:italic;}
  .if-text.f-name{font-size:15px;font-weight:600;}
  .if-text.f-note2{display:block;white-space:pre-wrap;line-height:1.6;font-size:13px;min-height:20px;}
  .if-input{font-family:inherit;border:1px solid var(--bd2);border-radius:8px;padding:5px 8px;background:#fffdf9;color:var(--ink);}
  .if-input.f-name{font-size:15px;font-weight:600;width:240px;}
  .if-input.f-note2{display:block;width:100%;min-height:48px;resize:vertical;font-size:13px;line-height:1.6;}
  .note-line{display:flex;align-items:flex-start;gap:6px;margin-top:8px;}
  .badge{font-size:10px;border-radius:9px;padding:1px 8px;color:#fff;}
  .badge.act{background:var(--static);} .badge.edit{background:var(--accent);}
  .badge.draft{background:#b8a888;} .badge.arch{background:#a89a86;}
  .arch-toggle{cursor:pointer;color:var(--sub);font-size:13px;padding:8px 4px;user-select:none;}
  .arch-toggle:hover{color:var(--ink);}
  .rs-id{font-size:11px;color:var(--sub);font-family:ui-monospace,monospace;}
  .rs-num{font-size:14px;font-weight:700;color:var(--accent);margin-right:2px;}
  .rs-meta{font-size:13px;color:var(--ink);font-weight:500;margin-top:10px;}
  .rs-top > .inline-field:first-child{flex:1;min-width:120px;}
  .rs-acts{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap;}
  .hint{color:var(--sub);font-size:13px;padding:12px 4px;line-height:1.7;}
  .role-warn{border:1px solid #e0b48a;background:#fbf1e4;border-radius:10px;padding:10px 12px;margin:0 0 12px;font-size:13px;line-height:1.8;color:#7a5230;}
  .saved{font-size:11px;color:var(--static);margin-left:6px;}
</style>
</head>
<body>
<header>
  <h1>套裝管理</h1>
  <button class="btn sm" id="btn-new">＋ 新套裝</button>
  <button class="btn sm" id="btn-rollback" title="把上線版回滾到上一版">⟲ 一鍵回滾</button>
  <button class="btn sm" id="btn-refresh">重新整理</button>
  <span class="grow"></span>
  <span id="status"></span>
  <button class="btn sm" id="btn-login">Google 登入</button>
  <button class="btn sm" id="btn-logout" style="display:none">登出</button>
</header>
<div class="cols">
  <section class="col-left">
    <div class="active-line" id="active-line"></div>
    <div id="list"></div>
  </section>
  <section class="col-right">
    <div class="an-title">版本比較</div>
    <div class="an-ctrl">
      <label class="lbl">基準 A</label><select id="cmp-a"></select>
      <label class="lbl">對照 B</label><select id="cmp-b"></select>
      <button class="btn sm primary" id="cmp-run">比較</button>
      <label class="gran"><input type="checkbox" id="cmp-obs"> 拆到觀察題</label>
    </div>
    <div id="diff-out" class="diff-out"><div class="hint">選兩個版本，按「比較」。</div></div>
  </section>
</div>
<script src="js/paired_map.js"></script>
<script type="module" src="js/rs_manager.js"></script>
</body>
</html>
