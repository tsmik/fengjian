<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>admin2 條件編輯器 — P2</title>
<style>
  :root { --bd:#d9d2c7; --bg:#faf7f2; --sel:#e8eef2; --ink:#3a352e; --sub:#8a8378; --accent:#3b6ea5; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:-apple-system,"PingFang TC","Microsoft JhengHei",sans-serif; color:var(--ink); background:var(--bg); font-size:14px; }
  header { display:flex; align-items:center; gap:10px; padding:10px 14px; border-bottom:1px solid var(--bd); background:#fff; flex-wrap:wrap; position:sticky; top:0; z-index:5; }
  header h1 { font-size:16px; margin:0; font-weight:600; }
  header .grow { flex:1; }
  #hdr-status { font-size:12px; color:var(--sub); }
  input.rs { border:1px solid var(--bd); border-radius:6px; padding:4px 8px; font-size:13px; }
  .btn { border:1px solid var(--bd); background:#fff; border-radius:6px; padding:5px 10px; cursor:pointer; font-size:13px; }
  .btn:hover { background:#f0ece5; }
  .btn.primary { background:var(--accent); color:#fff; border-color:var(--accent); }
  .btn.sm { padding:3px 8px; font-size:12px; }
  .btn.xs { padding:1px 6px; font-size:12px; }
  .btn.danger { color:#a33; }
  .wrap { display:grid; grid-template-columns:200px 200px 1fr 280px; gap:0; height:calc(100vh - 52px); }
  .col { border-right:1px solid var(--bd); overflow:auto; padding:8px; }
  #col-editor { background:#fff; }
  .col-title { font-weight:600; font-size:13px; margin:2px 0 8px; color:var(--ink); }
  .group-label { font-size:11px; color:var(--sub); margin:10px 0 4px; border-top:1px dashed var(--bd); padding-top:6px; }
  .list-row { display:flex; flex-direction:column; padding:6px 8px; border-radius:6px; cursor:pointer; }
  .list-row:hover { background:#f0ece5; }
  .list-row.sel { background:var(--sel); }
  .lr-name { font-size:13px; }
  .lr-sub { font-size:11px; color:var(--sub); }
  .hint { color:var(--sub); font-size:12px; padding:8px 4px; }
  .ed-title { font-weight:600; margin-bottom:10px; }
  .field { margin:8px 0; }
  .fl { display:block; font-size:12px; color:var(--sub); margin-bottom:4px; }
  label.inline { display:inline-flex; align-items:center; gap:3px; margin-right:12px; font-size:13px; }
  .num { width:90px; border:1px solid var(--bd); border-radius:6px; padding:4px 6px; }
  .cards-head { display:flex; align-items:center; justify-content:space-between; margin:12px 0 6px; font-size:12px; color:var(--sub); border-top:1px solid var(--bd); padding-top:8px; }
  .grp { border:1px solid var(--bd2); border-radius:10px; margin:8px 0 14px; background:#fbf7ef; overflow:hidden; }
  .grp-head { display:flex; align-items:center; gap:6px; padding:7px 10px; background:#efe7d6; border-bottom:1px solid var(--bd); }
  .grp-tag { font-size:10px; color:#fff; background:#7A9E7E; border-radius:9px; padding:1px 7px; }
  .grp-label { font-weight:600; font-size:14px; cursor:text; }
  .grp-label .pen { opacity:0; font-size:11px; color:var(--sub); }
  .grp-head:hover .grp-label .pen { opacity:1; }
  .grp > .card { margin:8px; }
  .grp > .hint { padding:8px 10px; }
  .card { border:1px solid var(--bd); border-radius:8px; padding:8px; margin:8px 0; background:#fcfbf9; }
  .card-head { display:flex; align-items:center; gap:6px; margin-bottom:6px; }
  .card-tag { font-weight:600; font-size:12px; }
  .spacer { flex:1; }
  .role-sel { border:1px solid var(--bd); border-radius:6px; padding:2px 4px; font-size:12px; }
  .or-sep { text-align:center; color:var(--sub); font-size:11px; margin:4px 0; }
  .combo { border:1px dashed var(--bd); border-radius:6px; padding:6px; margin:4px 0; background:#fff; }
  .combo.active { border-color:var(--accent); box-shadow:0 0 0 2px rgba(59,110,165,.15); }
  .combo.dragover { background:#eef5ff; border-color:var(--accent); }
  .combo-tag { font-size:11px; color:var(--sub); margin-right:6px; }
  .leaf { border:1px solid #e6e0d6; border-radius:6px; padding:5px 6px; margin:4px 0; background:#faf8f4; }
  .leaf-head { display:flex; align-items:center; justify-content:space-between; }
  .leaf-label { font-size:13px; }
  .opts { display:flex; flex-wrap:wrap; gap:4px; margin-top:4px; }
  .opt { font-size:12px; border:1px solid var(--bd); border-radius:12px; padding:1px 8px; cursor:pointer; background:#fff; }
  .opt.on { background:var(--accent); color:#fff; border-color:var(--accent); }
  .warn { color:#b06a00; font-size:11px; margin-top:3px; }
  .agg-row { display:flex; align-items:center; gap:6px; padding:4px 2px; font-size:13px; }
  #palette { background:#fbf9f5; }
  .pal-ctrl { display:flex; flex-direction:column; gap:4px; margin-bottom:6px; }
  .search { border:1px solid var(--bd); border-radius:6px; padding:4px 8px; }
  .pal-list { display:flex; flex-direction:column; gap:3px; }
  .pal-item { border:1px solid var(--bd); border-radius:6px; padding:5px 7px; background:#fff; cursor:grab; display:flex; flex-direction:column; }
  .pal-item:hover { background:#eef5ff; border-color:var(--accent); }
  .pi-label { font-size:13px; }
  .pi-id { font-size:11px; color:var(--sub); }
  .spice-row { display:flex; align-items:center; gap:8px; margin:6px 0; }
  .spice-lv { width:40px; font-weight:600; }
  .modal { display:none; position:fixed; inset:0; background:rgba(0,0,0,.35); align-items:center; justify-content:center; z-index:20; }
  .modal-box { background:#fff; border-radius:10px; padding:14px; width:min(720px,92vw); max-height:84vh; display:flex; flex-direction:column; gap:8px; }
  .modal-box textarea { width:100%; height:50vh; font-family:ui-monospace,Menlo,monospace; font-size:12px; border:1px solid var(--bd); border-radius:8px; padding:8px; }
  .modal-foot { display:flex; gap:8px; justify-content:flex-end; }
</style>
</head>
<body>
<header>
  <h1>admin2 條件編輯器</h1>
  <span class="hint" style="padding:0">套裝：</span>
  <input class="rs" id="rs-name" value="測試套裝">
  <button class="btn sm" id="btn-new">新套裝</button>
  <button class="btn sm" id="btn-export">匯出 JSON</button>
  <button class="btn sm primary" id="btn-save">存到 staging</button>
  <span class="grow"></span>
  <span id="hdr-status"></span>
  <button class="btn sm" id="btn-login">Google 登入</button>
  <button class="btn sm" id="btn-logout" style="display:none">登出</button>
</header>

<div class="wrap">
  <div class="col" id="col-dims"></div>
  <div class="col" id="col-parts"></div>
  <div class="col" id="col-editor"></div>
  <div class="col" id="palette">
    <div id="palette-inner"></div>
    <div id="spice-box" style="margin-top:14px;border-top:1px solid var(--bd);padding-top:8px"></div>
  </div>
</div>

<div class="modal" id="export-modal">
  <div class="modal-box">
    <div style="font-weight:600">套裝 JSON（v0.6 §A.2 形狀）</div>
    <textarea id="export-ta" readonly></textarea>
    <div class="modal-foot">
      <button class="btn" id="export-dl">下載 .json</button>
      <button class="btn" id="export-close">關閉</button>
    </div>
  </div>
</div>

<script src="js/dims_meta.js"></script>
<script src="js/observations_data.js"></script>
<script type="module" src="js/admin2.js"></script>
</body>
</html>
