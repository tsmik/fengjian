<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>admin2 條件編輯器 — P2</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root { --bg:#f6f1e9; --panel:#fbf8f2; --bd:#e3d9c8; --bd2:#d8ccb6; --ink:#4a443b; --sub:#9a8f7d; --static:#7A9E7E; --dynamic:#C17A5A; --sel:#efe7d6; --accent:#3b6ea5; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:"Noto Serif TC",serif; color:var(--ink); background:var(--bg); font-size:14px; }
  header { display:flex; align-items:center; gap:10px; padding:10px 14px; border-bottom:1px solid var(--bd2); background:var(--panel); flex-wrap:wrap; position:sticky; top:0; z-index:5; }
  header h1 { font-size:16px; margin:0; font-weight:600; }
  header .grow { flex:1; }
  #hdr-status { font-size:12px; color:var(--sub); }
  input.rs { border:1px solid var(--bd); border-radius:6px; padding:4px 8px; font-size:13px; }
  .btn { border:1px solid var(--bd2); background:var(--panel); border-radius:8px; padding:5px 10px; cursor:pointer; font-size:13px; color:var(--ink); }
  .btn:hover { background:var(--sel); }
  .btn.primary { background:var(--static); color:#fff; border-color:var(--static); }
  .btn.sm { padding:3px 8px; font-size:12px; }
  .btn.xs { padding:1px 6px; font-size:12px; }
  .btn.danger { color:#a33; }
  .wrap { display:grid; grid-template-columns:148px 158px 188px minmax(0,1fr) 270px; gap:0; height:calc(100vh - 52px); }
  .col { border-right:1px solid var(--bd); overflow:auto; padding:8px; }
  .col-cards-wrap { display:flex; flex-direction:column; overflow:hidden; padding:0; background:var(--panel); }
  #col-cards { flex:1; overflow:auto; padding:10px; }
  .spice-bar { border-top:1px solid var(--bd2); background:#f7f2ea; padding:8px 12px 10px; }
  .spice-bar .sb-title { font-size:12px; color:var(--sub); margin-bottom:2px; }
  .spice-row { display:flex; align-items:center; gap:10px; margin:7px 0; }
  .spice-lv { width:42px; font-weight:600; font-size:13px; }
  .spice-row input[type=range] { flex:1; accent-color:#C17A5A; height:6px; }
  .spice-val { width:42px; text-align:right; font-size:13px; }
  .grp-row { display:flex; align-items:center; gap:3px; padding:6px 7px; border-radius:7px; cursor:pointer; }
  .grp-row:hover { background:var(--sel); }
  .grp-row.sel { background:var(--sel); }
  .gr-name { flex:1; font-size:13px; }
  .gr-cnt { font-size:11px; color:var(--sub); }
  /* 敘述分組＝卡片 管理列（col3） */
  .cardrow { border:1px solid var(--bd2); border-radius:9px; margin:7px 0; padding:6px; background:#fbf7ef; }
  /* 未完成卡片（無題目 或 有題目沒設條件）：淡黃底提示 */
  .cardrow.incomplete { background:#fcf4d2; border-color:#e6d49a; }
  .card.incomplete { background:#fcf4d2; border-color:#e6d49a; }
  /* 主卡片：淡褐紅底 */
  .cardrow.main { background:#f4e0d5; border-color:#d8b6a3; }
  .card.main { background:#f4e0d5; border-color:#d8b6a3; }
  /* col2 部位列：右側卡片計數 */
  .pr-line { display:flex; align-items:center; width:100%; }
  .pr-cnt { font-size:11px; color:var(--sub); margin-left:6px; white-space:nowrap; }
  /* col4 條件選項的 hint（顯示在選項下方小灰字） */
  /* 條件 + hint 橫向並排：條件 hint 條件 hint…；hint 字級同條件 */
  .opt-wrap { display:inline-flex; flex-direction:row; align-items:center; gap:4px; vertical-align:top; }
  .opt-hint { font-size:12px; color:var(--sub); cursor:pointer; }
  /* 卡片列三組:名稱/主輔/按鈕 —— 欄寬足夠時一行，過窄時依序上下排 */
  .cr-top { display:flex; align-items:center; gap:4px 6px; flex-wrap:wrap; }
  .cr-r { display:flex; align-items:center; gap:4px; }
  .cr-r-name { flex:1 1 110px; min-width:0; }
  .cr-name { flex:1; min-width:0; width:100%; }   /* 隨欄縮，不突出卡片 */
  .cr-name { flex:1; min-width:0; font-family:inherit; font-size:13px; border:1px solid var(--bd2); border-radius:6px; padding:4px 6px; background:#fffdf9; }
  .cr-role { font-family:inherit; font-size:12px; border:1px solid var(--bd2); border-radius:6px; padding:3px; }
  .cr-role.role-main { border-color:var(--dynamic); border-width:1.5px; }   /* 主：褐紅框 */
  .cr-role.role-unset { border-color:#d9534f; border-width:1.5px; }          /* 未設主輔：紅框提醒 */
  .cr-note { width:100%; margin-top:5px; resize:vertical; min-height:30px; font-family:inherit; font-size:12px; border:1px solid var(--bd2); border-radius:6px; padding:4px 6px; background:#fffdf9; color:var(--ink); }
  /* col4 卡片標頭 */
  .role-badge { font-size:10px; color:#fff; background:#C17A5A; border-radius:9px; padding:1px 7px; }
  .role-badge.none { background:#cdbfa6; }
  .combo-head { display:flex; align-items:center; gap:6px; }
  .save-status { font-size:12px; white-space:nowrap; cursor:help; }
  .save-status.dirty { color:var(--dynamic); }
  .save-status.ok { color:var(--static); }
  /* col1 維度：一行（名稱＋符合為X）；靠左對齊，與「維度」標題同左邊界 */
  .dim-row { display:flex; align-items:center; }
  #col-dims .list-row { align-items:flex-start; padding-left:0; }
  .dim-name { font-size:14px; white-space:nowrap; }
  .dim-tgt { font-size:13px; color:var(--sub); }   /* 「符合為X」縮小，與部位名同大 */
  /* col2 維度極性設定 */
  .pole-ctrl { border:1px solid var(--bd); border-radius:8px; padding:6px 8px; margin:4px 0 10px; background:#fbf8f2; display:flex; flex-direction:column; gap:3px; }
  .pole-opt { display:inline-flex; align-items:center; gap:3px; font-size:12px; cursor:pointer; margin-right:8px; }
  .pole-opt input { margin:0; }
  .pole-tgt { display:flex; align-items:center; gap:4px; border-top:1px dashed var(--bd); margin-top:4px; padding-top:5px; }
  .pole-tgt .fl { margin:0; }
  /* col2 部位 inline 小字 */
  .pr-sub { font-size:11px; color:var(--sub); }
  /* col3 標題副粗體（敘述分組＝卡片）＋ 卡片管理列 */
  .col-title.sub { display:flex; align-items:center; gap:6px; border-top:1px solid var(--bd); padding-top:8px; margin-top:8px; color:var(--ink); }
  .add-card { margin-left:auto; }
  .cardlist { display:flex; flex-direction:column; gap:0; }
  .cardrow.dragging { opacity:.5; }
  .cardrow.drop-into { box-shadow:0 -2px 0 var(--static); }
  .drag-h { cursor:grab; color:var(--sub); font-size:13px; user-select:none; padding:0 2px; }
  .note-toggle.has { background:var(--static); color:#fff; border-color:var(--static); }
  /* col3 聚合唯讀 */
  .agg-ro { margin-top:8px; }
  .agg-ro-th { font-weight:600; margin-bottom:6px; }
  .agg-ro-row { font-size:13px; padding:2px 0; color:var(--ink); }
  /* col4 葉：L/R 標籤＋未定義橘字 */
  .lr-tag { font-size:10px; color:var(--sub); border:1px solid var(--bd2); border-radius:8px; padding:0 6px; }
  .undef { font-size:11px; color:var(--dynamic); margin-left:6px; }
  /* col5 palette L/R */
  .pi-row { display:flex; align-items:center; justify-content:space-between; gap:4px; }
  /* col3 每部位辣度門檻 */
  .spice-need { border:1px solid var(--bd2); border-radius:8px; padding:6px 8px; margin:6px 0 4px; background:#f7f2ea; }
  .spice-need-row { display:flex; gap:8px 10px; margin-top:4px; flex-wrap:wrap; }   /* 欄寬過窄時辣度自動換行(上下排) */
  .sn-cell { flex:0 0 auto; }
  .sn-cell { display:flex; align-items:center; gap:3px; font-size:12px; }
  .sn-lv { color:var(--sub); }
  .sn-num { width:42px; border:1px solid var(--bd2); border-radius:6px; padding:3px 5px; font-family:inherit; }
  /* 套裝管理 */
  .rs-row { display:flex; align-items:center; gap:8px; padding:8px 6px; border-bottom:1px solid var(--bd); }
  .rs-main { flex:1; min-width:0; }
  .rs-name2 { font-size:14px; display:flex; align-items:center; gap:6px; }
  .rs-sub { font-size:11px; color:var(--sub); }
  .rs-acts { display:flex; gap:4px; }
  .rs-badge { font-size:10px; border-radius:8px; padding:1px 7px; color:#fff; }
  .rs-badge.act { background:var(--static); }
  .rs-badge.edit { background:var(--accent); }
  /* 可拖欄寬分隔線 */
  .splitter { position:fixed; top:52px; bottom:0; width:8px; margin-left:-4px; cursor:col-resize; z-index:8; }
  .splitter:hover, .splitter.drag { background:rgba(122,158,126,.3); }
  #col-editor { background:var(--panel); }
  .col-title { font-weight:600; font-size:13px; margin:2px 0 8px; color:var(--ink); }
  .group-label { font-size:11px; color:var(--sub); margin:10px 0 4px; border-top:1px dashed var(--bd); padding-top:6px; }
  .list-row { display:flex; flex-direction:column; padding:6px 8px; border-radius:6px; cursor:pointer; }
  .list-row:hover { background:var(--sel); }
  .list-row.sel { background:var(--sel); }
  /* 維度/部位含未完成卡片 → 淡黃；選中且未完成 → 較深黃（仍看得出選中）*/
  .list-row.incomplete { background:#fcf4d2; }
  .list-row.sel.incomplete { background:#f1e3a8; }
  .lr-name { font-size:13px; }
  .lr-sub { font-size:11px; color:var(--sub); }
  .hint { color:var(--sub); font-size:12px; padding:8px 4px; }
  .ed-title { font-weight:600; margin-bottom:10px; }
  .field { margin:8px 0; }
  .fl { display:block; font-size:12px; color:var(--sub); margin-bottom:4px; }
  label.inline { display:inline-flex; align-items:center; gap:3px; margin-right:12px; font-size:13px; }
  .num { width:90px; border:1px solid var(--bd); border-radius:6px; padding:4px 6px; }
  .cards-head { display:flex; align-items:center; justify-content:space-between; margin:12px 0 6px; font-size:12px; color:var(--sub); border-top:1px solid var(--bd); padding-top:8px; }
  .grp { border:1px solid var(--bd2); border-radius:10px; margin:8px 0 14px; background:#fbf7ef; overflow:hidden; }
  .grp-head { display:flex; align-items:center; gap:6px; padding:7px 10px; background:#efe7d6; border-bottom:1px solid var(--bd); }
  .grp-tag { font-size:10px; color:#fff; background:#7A9E7E; border-radius:9px; padding:1px 7px; }
  .grp-label { font-weight:600; font-size:14px; cursor:text; }
  .grp-label .pen { opacity:0; font-size:11px; color:var(--sub); }
  .grp-head:hover .grp-label .pen { opacity:1; }
  .grp > .card { margin:8px; }
  .grp > .hint { padding:8px 10px; }
  .card { border:1px solid var(--bd); border-radius:8px; padding:8px; margin:8px 0; background:#fcfbf9; }
  .card-head { display:flex; align-items:center; gap:6px; margin-bottom:6px; }
  .card-tag { font-weight:600; font-size:12px; }
  .spacer { flex:1; }
  .role-sel { border:1px solid var(--bd); border-radius:6px; padding:2px 4px; font-size:12px; }
  .or-sep { text-align:center; color:var(--sub); font-size:11px; margin:4px 0; }
  .combo { border:1px dashed var(--bd); border-radius:6px; padding:6px; margin:4px 0; background:#fff; }
  .combo.active { border-color:var(--accent); box-shadow:0 0 0 2px rgba(59,110,165,.15); }
  .combo.dragover { background:#eef5ff; border-color:var(--accent); }
  .combo-tag { font-size:11px; color:var(--sub); margin-right:6px; }
  .leaf { border:1px solid #e6e0d6; border-radius:6px; padding:5px 6px; margin:4px 0; background:#faf8f4; }
  .leaf-head { display:flex; align-items:center; justify-content:space-between; }
  .leaf-label { font-size:13px; }
  .opts { display:flex; flex-wrap:wrap; gap:5px 12px; margin-top:4px; align-items:center; }
  .opt { font-size:12px; border:1px solid var(--bd); border-radius:12px; padding:1px 8px; cursor:pointer; background:#fff; }
  .opt.on { background:var(--accent); color:#fff; border-color:var(--accent); }
  .warn { color:#b06a00; font-size:11px; margin-top:3px; }
  .agg-row { display:flex; align-items:center; gap:6px; padding:4px 2px; font-size:13px; }
  #palette { background:var(--panel); }
  .pal-ctrl { display:flex; flex-direction:column; gap:4px; margin-bottom:6px; }
  .search { border:1px solid var(--bd); border-radius:6px; padding:4px 8px; }
  .pal-list { display:flex; flex-direction:column; gap:3px; }
  .pal-sec { font-size:11px; font-weight:600; color:var(--sub); margin:9px 2px 2px; border-top:1px dashed var(--bd); padding-top:6px; }
  .pal-sec:first-child { border-top:0; margin-top:2px; padding-top:0; }
  .pal-item { border:1px solid var(--bd); border-radius:6px; padding:5px 7px; background:#fff; cursor:grab; display:flex; flex-direction:column; }
  .pal-item:hover { background:#eef5ff; border-color:var(--accent); }
  .pal-item.pal-stale { background:#fcf4d2; border-color:#e6d49a; }   /* 題目被改過→需檢視 */
  .pi-label { font-size:13px; }
  .pi-id { font-size:11px; color:var(--sub); }
  .spice-row { display:flex; align-items:center; gap:8px; margin:6px 0; }
  .spice-lv { width:40px; font-weight:600; }
  /* 鍵盤導覽焦點框 */
  .kbd-focus { outline:2px solid var(--accent); outline-offset:-1px; border-radius:6px; }
  .modal { display:none; position:fixed; inset:0; background:rgba(0,0,0,.35); align-items:center; justify-content:center; z-index:20; }
  .modal-box { background:#fff; border-radius:10px; padding:14px; width:min(720px,92vw); max-height:84vh; display:flex; flex-direction:column; gap:8px; }
  .modal-box textarea { width:100%; height:50vh; font-family:ui-monospace,Menlo,monospace; font-size:12px; border:1px solid var(--bd); border-radius:8px; padding:8px; }
  .modal-foot { display:flex; gap:8px; justify-content:flex-end; }
</style>
</head>
<body>
<header>
  <h1>admin2 條件編輯器</h1>
  <span class="hint" style="padding:0">套裝：</span>
  <select class="rs" id="rs-select" title="選擇要編輯的套裝（在「套裝」分頁建立/改名）"></select>
  <button class="btn sm" id="btn-reload" title="從 staging 重新載入目前套裝（拉最新內容，例如匯入後）">↻ 重載</button>
  <button class="btn sm" id="btn-undo" title="復原 (⌘/Ctrl+Z)" disabled>↶ 復原</button>
  <button class="btn sm" id="btn-redo" title="重做 (⌘/Ctrl+Shift+Z)" disabled>↷ 重做</button>
  <button class="btn sm" id="btn-export">匯出 JSON</button>
  <button class="btn sm" id="btn-export-md" title="把各維度條件匯出成人看的 Markdown">匯出 MD</button>
  <button class="btn sm primary" id="btn-save">儲存</button>
  <button class="btn sm" id="btn-setlive" title="把目前套裝設為學員看到的版本">設為上線</button>
  <button class="btn sm" id="btn-obsdone" title="題庫變動已檢視→清除黃標" style="display:none;background:#fcf4d2;border-color:#e6d49a;">✓ 題庫變動已處理</button>
  <span class="save-status" id="save-status"></span>
  <span class="grow"></span>
  <span id="hdr-status"></span>
  <button class="btn sm" id="btn-login">Google 登入</button>
  <button class="btn sm" id="btn-logout" style="display:none">登出</button>
</header>

<div class="wrap" id="wrap">
  <div class="col" id="col-dims"></div>
  <div class="col" id="col-parts"></div>
  <div class="col" id="col-groups"></div>
  <div class="col-cards-wrap" id="col-cards-wrap">
    <div id="col-cards"></div>
    <div id="spice-box" class="spice-bar"></div>
  </div>
  <div class="col" id="palette"><div id="palette-inner"></div></div>
</div>
<div class="splitter" id="split-a"></div>
<div class="splitter" id="split-b"></div>
<script>
  // 可拖三欄寬（敘述分組 col3 / observation col5；葉 col4 = 中間自動填滿）
  (function () {
    var wrap = document.getElementById('wrap');
    var cw; try { cw = JSON.parse(localStorage.getItem('admin2_colw') || 'null'); } catch (e) {}
    if (!cw) cw = { w3: 188, w5: 270 };
    function apply() { wrap.style.gridTemplateColumns = '148px 158px ' + cw.w3 + 'px minmax(0,1fr) ' + cw.w5 + 'px'; place(); }
    function place() {
      document.getElementById('split-a').style.left = document.getElementById('col-groups').getBoundingClientRect().right + 'px';
      document.getElementById('split-b').style.left = document.getElementById('col-cards-wrap').getBoundingClientRect().right + 'px';
    }
    function drag(handle, onMove) {
      handle.addEventListener('mousedown', function (e) {
        e.preventDefault(); handle.classList.add('drag');
        var sx = e.clientX, s3 = cw.w3, s5 = cw.w5;
        function mm(ev) { onMove(ev.clientX - sx, s3, s5); apply(); }
        function mu() { handle.classList.remove('drag'); document.removeEventListener('mousemove', mm); document.removeEventListener('mouseup', mu); try { localStorage.setItem('admin2_colw', JSON.stringify(cw)); } catch (e) {} }
        document.addEventListener('mousemove', mm); document.addEventListener('mouseup', mu);
      });
    }
    drag(document.getElementById('split-a'), function (dx, s3) { cw.w3 = Math.max(120, Math.min(480, s3 + dx)); });
    drag(document.getElementById('split-b'), function (dx, s3, s5) { cw.w5 = Math.max(160, Math.min(560, s5 - dx)); });
    window.addEventListener('resize', place);
    apply();
  })();
</script>

<div class="modal" id="export-modal">
  <div class="modal-box">
    <div style="font-weight:600" id="export-title">套裝 JSON（v0.6 §A.2 形狀）</div>
    <textarea id="export-ta" readonly></textarea>
    <div class="modal-foot">
      <button class="btn" id="export-dl">下載 .json</button>
      <button class="btn" id="export-close">關閉</button>
    </div>
  </div>
</div>


<script src="js/dims_meta.js"></script>
<script src="js/observations_data.js"></script>
<script src="js/paired_map.js"></script>
<script type="module" src="js/admin2.js"></script>
</body>
</html>
