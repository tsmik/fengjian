<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>講義編輯器 — admin2</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{ --bg:#f6f1e9; --panel:#fbf8f2; --bd:#e3d9c8; --bd2:#d8ccb6; --ink:#4a443b; --sub:#9a8f7d; --static:#7A9E7E; --dynamic:#C17A5A; --sel:#efe7d6; --accent:#3b6ea5; }
  *{box-sizing:border-box;}
  body{margin:0;font-family:"Noto Serif TC",serif;color:var(--ink);background:var(--bg);font-size:14px;}
  header{display:flex;align-items:center;gap:10px;padding:11px 16px;background:var(--panel);border-bottom:1px solid var(--bd2);position:sticky;top:0;z-index:5;flex-wrap:wrap;}
  header h1{font-size:17px;margin:0;font-weight:600;letter-spacing:.5px;}
  .grow{flex:1;}
  #status{font-size:12px;color:var(--sub);}
  .save-status{font-size:12px;}
  .save-status.dirty{color:var(--dynamic);} .save-status.ok{color:var(--static);}
  .btn{font-family:inherit;border:1px solid var(--bd2);background:var(--panel);border-radius:8px;padding:6px 12px;cursor:pointer;font-size:13px;color:var(--ink);}
  .btn:hover{background:var(--sel);}
  .btn.primary{background:var(--static);color:#fff;border-color:var(--static);}
  .btn.sm{padding:4px 10px;font-size:12px;}
  .chips{display:flex;flex-wrap:wrap;gap:5px;padding:8px 16px;background:var(--panel);border-bottom:1px solid var(--bd);position:sticky;top:49px;z-index:4;}
  .chip{font-size:12px;border:1px solid var(--bd2);border-radius:20px;padding:2px 10px;cursor:pointer;background:#fffdf9;}
  .chip:hover{background:var(--sel);}
  .wrap{max-width:860px;margin:0 auto;padding:16px;}
  .role-warn{border:1px solid #e0b48a;background:#fbf1e4;border-radius:10px;padding:10px 12px;margin:0 0 14px;font-size:13px;line-height:1.8;color:#7a5230;}
  .dim-block{background:var(--panel);border:1px solid var(--bd);border-left:5px solid var(--hue,#bbb);border-radius:10px;padding:12px 14px;margin:0 0 14px;}
  .dim-head{display:flex;align-items:baseline;gap:8px;margin-bottom:8px;}
  .dim-no{font-weight:700;color:var(--hue,#888);}
  .dim-name{font-size:16px;font-weight:600;}
  .dim-poles{font-size:12px;color:var(--sub);}
  .pole-s{color:var(--static);} .pole-d{color:var(--dynamic);}
  .dim-ta{width:100%;min-height:120px;resize:vertical;font-family:inherit;font-size:14px;line-height:1.7;border:1px solid var(--bd2);border-radius:8px;padding:9px 11px;background:#fffdf9;color:var(--ink);}
  .hint{color:var(--sub);font-size:13px;padding:12px 4px;line-height:1.7;}
</style>
</head>
<body>
<header>
  <h1>講義編輯器</h1>
  <span class="hint" style="padding:0">板書文字（每維度一段，全域）</span>
  <button class="btn sm primary" id="btn-save">儲存</button>
  <span class="save-status" id="save-status"></span>
  <span class="grow"></span>
  <span id="status"></span>
  <button class="btn sm" id="btn-login">Google 登入</button>
  <button class="btn sm" id="btn-logout" style="display:none">登出</button>
</header>
<div class="chips" id="chips"></div>
<div class="wrap">
  <div id="warn"></div>
  <div id="dims"></div>
</div>
<script src="js/dims_meta.js"></script>
<script type="module" src="js/lectures.js"></script>
</body>
</html>
