<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>使用者 / 白名單 — admin2</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{ --bg:#f6f1e9; --panel:#fbf8f2; --bd:#e3d9c8; --bd2:#d8ccb6; --ink:#4a443b; --sub:#9a8f7d; --static:#7A9E7E; --dynamic:#C17A5A; --sel:#efe7d6; --accent:#3b6ea5; }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{margin:0;font-family:"Noto Serif TC",serif;color:var(--ink);background:var(--bg);font-size:14px;display:flex;flex-direction:column;height:100vh;overflow:hidden;}
  header{display:flex;align-items:center;gap:10px;padding:9px 16px;background:var(--panel);border-bottom:1px solid var(--bd2);flex:0 0 auto;flex-wrap:wrap;}
  header h1{font-size:16px;margin:0;font-weight:600;}
  .grow{flex:1;}
  #status{font-size:12px;color:var(--sub);}
  .btn{font-family:inherit;border:1px solid var(--bd2);background:var(--panel);border-radius:8px;padding:6px 12px;cursor:pointer;font-size:13px;color:var(--ink);}
  .btn:hover{background:var(--sel);}
  .btn.primary{background:var(--static);color:#fff;border-color:var(--static);}
  .btn.sm{padding:4px 10px;font-size:12px;}
  .btn.xs{padding:2px 7px;font-size:11px;border-radius:6px;}
  .btn.danger{color:#a8503a;}
  .btn:disabled{opacity:.5;cursor:not-allowed;}
  input,select,textarea{font-family:inherit;color:var(--ink);}
  .badge{font-size:10px;color:#fff;border-radius:9px;padding:1px 8px;white-space:nowrap;}
  .badge.admin{background:#a8503a;} .badge.teacher{background:var(--accent);} .badge.student{background:#b8a888;}
  .role-warn{flex:0 0 auto;border-bottom:1px solid #e0b48a;background:#fbf1e4;padding:7px 16px;font-size:12px;color:#7a5230;}

  /* ── 三欄 ── */
  .cols{flex:1;display:flex;min-height:0;}
  .col{height:100%;overflow:auto;}
  .col-groups{flex:0 0 196px;border-right:1px solid var(--bd2);background:var(--panel);display:flex;flex-direction:column;}
  .col-cards{flex:0 0 312px;border-right:1px solid var(--bd2);display:flex;flex-direction:column;}
  .col-detail{flex:1;min-width:0;background:var(--panel);}
  .col-title{font-size:12px;color:var(--sub);padding:10px 14px 6px;font-weight:600;letter-spacing:.04em;}

  /* 左欄：分組 */
  .glist{flex:1;overflow:auto;}
  .grow-spacer{flex:1;}
  .g-item{display:flex;align-items:center;gap:6px;padding:8px 12px;cursor:pointer;border-left:3px solid transparent;font-size:14px;}
  .g-item:hover{background:var(--sel);}
  .g-item.sel{background:var(--sel);border-left-color:var(--static);font-weight:600;}
  .g-item .g-name{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .g-item .g-cnt{font-size:11px;color:var(--sub);}
  .g-item .g-ops{display:none;gap:2px;}
  .g-item:hover .g-ops{display:flex;}
  .g-add{border-top:1px solid var(--bd);padding:10px 12px;display:flex;gap:6px;flex-direction:column;}
  .g-add input{font-size:13px;border:1px solid var(--bd2);border-radius:8px;padding:6px 9px;background:#fffdf9;width:100%;}
  .g-note{font-size:11px;color:var(--sub);padding:9px 12px;line-height:1.7;border-top:1px solid var(--bd);}

  /* 中欄：名片卡 */
  .addbar{padding:10px 12px;border-bottom:1px solid var(--bd);display:flex;gap:6px;flex-wrap:wrap;}
  .addbar input{font-size:13px;border:1px solid var(--bd2);border-radius:8px;padding:6px 9px;background:#fffdf9;flex:1;min-width:120px;}
  .addbar select{font-size:12px;border:1px solid var(--bd2);border-radius:8px;padding:6px 7px;background:#fffdf9;}
  .clist{flex:1;overflow:auto;padding:8px;}
  .ncard{display:flex;align-items:center;gap:10px;padding:9px 10px;border:1px solid var(--bd);border-radius:10px;margin-bottom:8px;cursor:pointer;background:var(--panel);}
  .ncard:hover{background:#fcfaf4;border-color:var(--bd2);}
  .ncard.sel{border-color:var(--static);box-shadow:0 0 0 1px var(--static) inset;}
  .av{width:38px;height:38px;border-radius:50%;object-fit:cover;flex:0 0 38px;background:var(--sel);border:1px solid var(--bd);}
  .av.ph{display:flex;align-items:center;justify-content:center;color:var(--sub);font-size:15px;font-weight:600;}
  .ncard-main{flex:1;min-width:0;}
  .ncard-name{font-size:14px;font-weight:600;line-height:1.4;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .ncard-note{font-size:12px;color:var(--sub);line-height:1.4;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-top:1px;}

  /* 右欄：預覽 / 編輯 */
  .detail-wrap{max-width:520px;padding:20px 22px;}
  .d-empty{color:var(--sub);font-size:14px;padding:40px 22px;line-height:1.9;}
  .d-photo-row{display:flex;align-items:center;gap:16px;margin-bottom:18px;flex-wrap:wrap;}
  .d-photo{width:104px;height:104px;border-radius:14px;object-fit:cover;background:var(--sel);border:1px solid var(--bd);}
  .d-photo.ph{display:flex;align-items:center;justify-content:center;color:var(--sub);font-size:13px;text-align:center;}
  .fld{margin-top:13px;}
  .fld>label{display:block;font-size:12px;color:var(--sub);margin-bottom:4px;}
  .fld input[type=text],.fld textarea,.fld select{width:100%;font-size:14px;border:1px solid var(--bd2);border-radius:8px;padding:7px 10px;background:#fffdf9;}
  .fld textarea{min-height:80px;resize:vertical;line-height:1.6;}
  .fld.ro .v{font-size:14px;padding:2px 0;word-break:break-all;color:var(--ink);}
  .d-foot{display:flex;align-items:center;gap:10px;margin-top:20px;flex-wrap:wrap;}
  .save-state{font-size:12px;color:var(--sub);}
  .save-state.ok{color:var(--static);} .save-state.err{color:#a8503a;}
  .hint{color:var(--sub);font-size:13px;padding:14px;line-height:1.7;}

  @media(max-width:780px){
    .col-groups{flex-basis:140px;} .col-cards{flex-basis:210px;}
  }
</style>
</head>
<body>
<script src="js/admin_nav.js"></script>
<header>
  <h1>使用者 / 白名單</h1>
  <button class="btn sm" id="btn-refresh">重新整理</button>
  <span class="grow"></span>
  <span id="status"></span>
  <span id="me-badge"></span>
  <button class="btn sm" id="btn-login">Google 登入</button>
  <button class="btn sm" id="btn-logout" style="display:none">登出</button>
</header>
<div id="warn"></div>
<div class="cols">
  <div class="col col-groups">
    <div class="col-title">分組</div>
    <div class="glist" id="glist"></div>
    <div class="g-add" id="g-add"></div>
    <div class="g-note" id="g-note"></div>
  </div>
  <div class="col col-cards">
    <div class="addbar" id="addbar"></div>
    <div class="clist" id="clist"></div>
  </div>
  <div class="col col-detail" id="detail"></div>
</div>
<script type="module" src="js/users_admin.js"></script>
</body>
</html>
