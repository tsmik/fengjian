<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>使用者 / 白名單 — admin2</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{ --bg:#f6f1e9; --panel:#fbf8f2; --bd:#e3d9c8; --bd2:#d8ccb6; --ink:#4a443b; --sub:#9a8f7d; --static:#7A9E7E; --dynamic:#C17A5A; --sel:#efe7d6; --accent:#3b6ea5; }
  *{box-sizing:border-box;}
  body{margin:0;font-family:"Noto Serif TC",serif;color:var(--ink);background:var(--bg);font-size:14px;}
  header{display:flex;align-items:center;gap:10px;padding:11px 16px;background:var(--panel);border-bottom:1px solid var(--bd2);position:sticky;top:0;z-index:5;flex-wrap:wrap;}
  header h1{font-size:17px;margin:0;font-weight:600;}
  .grow{flex:1;}
  #status{font-size:12px;color:var(--sub);}
  .btn{font-family:inherit;border:1px solid var(--bd2);background:var(--panel);border-radius:8px;padding:6px 12px;cursor:pointer;font-size:13px;color:var(--ink);}
  .btn:hover{background:var(--sel);}
  .btn.primary{background:var(--static);color:#fff;border-color:var(--static);}
  .btn.sm{padding:4px 10px;font-size:12px;}
  .btn.xs{padding:2px 8px;font-size:12px;border-radius:6px;}
  .btn.danger{color:#a8503a;}
  .btn:disabled{opacity:.5;cursor:not-allowed;}
  .wrap{max-width:760px;margin:0 auto;padding:16px;}
  .me{background:var(--panel);border:1px solid var(--bd);border-radius:10px;padding:10px 12px;margin-bottom:14px;font-size:13px;line-height:1.8;}
  .me b{font-weight:600;}
  .addbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:12px;}
  .addbar input{font-family:inherit;font-size:14px;border:1px solid var(--bd2);border-radius:8px;padding:7px 10px;background:#fffdf9;min-width:240px;}
  select{font-family:inherit;font-size:13px;border:1px solid var(--bd2);border-radius:8px;padding:6px 8px;background:#fffdf9;}
  .badge{font-size:10px;color:#fff;border-radius:9px;padding:1px 8px;white-space:nowrap;}
  .badge.admin{background:#a8503a;} .badge.teacher{background:var(--accent);} .badge.student{background:#b8a888;}
  .hint{color:var(--sub);font-size:13px;padding:12px 4px;line-height:1.7;}
  .role-warn{border:1px solid #e0b48a;background:#fbf1e4;border-radius:10px;padding:10px 12px;margin:0 0 12px;font-size:13px;line-height:1.8;color:#7a5230;}
  .note-line{font-size:12px;color:var(--sub);margin:14px 4px;line-height:1.7;}

  /* ── 學員卡片 ── */
  .card{background:var(--panel);border:1px solid var(--bd);border-radius:12px;margin-bottom:10px;overflow:hidden;}
  .card.open{border-color:var(--bd2);box-shadow:0 1px 4px rgba(74,68,59,.07);}
  .card-head{display:flex;align-items:center;gap:11px;padding:10px 12px;cursor:pointer;}
  .card-head:hover{background:#fcfaf4;}
  .avatar{width:42px;height:42px;border-radius:50%;object-fit:cover;flex:0 0 42px;background:var(--sel);border:1px solid var(--bd);}
  .avatar.ph{display:flex;align-items:center;justify-content:center;color:var(--sub);font-size:17px;font-weight:600;}
  .card-main{flex:1;min-width:0;}
  .card-name{font-size:15px;font-weight:600;line-height:1.4;word-break:break-all;}
  .card-name .em-sub{font-size:11px;color:var(--sub);font-weight:400;margin-left:6px;word-break:break-all;}
  .card-meta{font-size:12px;color:var(--sub);margin-top:2px;display:flex;gap:8px;align-items:center;flex-wrap:wrap;}
  .chev{flex:0 0 auto;color:var(--sub);font-size:12px;transition:transform .15s;}
  .card.open .chev{transform:rotate(90deg);}

  .card-body{display:none;padding:4px 14px 14px;border-top:1px solid var(--bd);}
  .card.open .card-body{display:block;}
  .fld{margin-top:12px;}
  .fld > label{display:block;font-size:12px;color:var(--sub);margin-bottom:4px;}
  .fld input[type=text], .fld textarea, .fld select{width:100%;font-family:inherit;font-size:14px;border:1px solid var(--bd2);border-radius:8px;padding:7px 10px;background:#fffdf9;color:var(--ink);}
  .fld textarea{min-height:64px;resize:vertical;line-height:1.6;}
  .fld.ro{color:var(--ink);}
  .fld.ro .v{font-size:14px;padding:2px 0;word-break:break-all;}
  .photo-row{display:flex;align-items:center;gap:12px;flex-wrap:wrap;}
  .photo-prev{width:80px;height:80px;border-radius:10px;object-fit:cover;background:var(--sel);border:1px solid var(--bd);}
  .photo-prev.ph{display:flex;align-items:center;justify-content:center;color:var(--sub);font-size:12px;}
  .card-foot{display:flex;align-items:center;gap:10px;margin-top:16px;flex-wrap:wrap;}
  .save-state{font-size:12px;color:var(--sub);}
  .save-state.ok{color:var(--static);}
  .save-state.err{color:#a8503a;}
</style>
</head>
<body>
<header>
  <h1>使用者 / 白名單</h1>
  <button class="btn sm" id="btn-refresh">重新整理</button>
  <span class="grow"></span>
  <span id="status"></span>
  <button class="btn sm" id="btn-login">Google 登入</button>
  <button class="btn sm" id="btn-logout" style="display:none">登出</button>
</header>
<div class="wrap">
  <div id="me" class="me"></div>
  <div id="warn"></div>
  <div class="addbar">
    <input id="add-email" type="email" placeholder="輸入 email 加入白名單…" autocomplete="off">
    <select id="add-role"><option value="student">學員</option><option value="teacher">老師(teacher)</option><option value="admin">管理員(admin)</option></select>
    <button class="btn sm primary" id="add-btn">＋ 加入</button>
  </div>
  <div id="list"></div>
  <div class="note-line" id="effect-note"></div>
</div>
<script type="module" src="js/users_admin.js"></script>
</body>
</html>
