<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>移植比對：rbf1 → rbf2 套裝</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{ --bg:#f6f1e9; --panel:#fbf8f2; --bd:#e3d9c8; --bd2:#d8ccb6; --ink:#4a443b; --sub:#9a8f7d; --static:#7A9E7E; --dynamic:#C17A5A; --sel:#efe7d6; --accent:#3b6ea5; }
  *{box-sizing:border-box;}
  body{margin:0;font-family:"Noto Serif TC",serif;color:var(--ink);background:var(--bg);font-size:14px;}
  header{padding:11px 16px;background:var(--panel);border-bottom:1px solid var(--bd2);}
  header h1{font-size:17px;margin:0;font-weight:600;}
  .wrap{max-width:960px;margin:0 auto;padding:16px;}
  .btn{font-family:inherit;border:1px solid var(--bd2);background:var(--panel);border-radius:8px;padding:7px 13px;cursor:pointer;font-size:14px;color:var(--ink);}
  .btn:hover{background:var(--sel);} .btn.primary{background:var(--static);color:#fff;border-color:var(--static);} .btn:disabled{opacity:.45;cursor:not-allowed;}
  select{font-family:inherit;font-size:14px;border:1px solid var(--bd2);border-radius:8px;padding:6px 9px;background:#fffdf9;color:var(--ink);max-width:100%;}
  .step{background:var(--panel);border:1px solid var(--bd);border-radius:12px;padding:14px 16px;margin-bottom:14px;}
  .step h2{font-size:15px;margin:0 0 8px;font-weight:600;}
  .num{display:inline-flex;width:22px;height:22px;border-radius:50%;background:var(--sel);align-items:center;justify-content:center;font-size:12px;margin-right:8px;font-weight:600;}
  .step.done .num{background:var(--static);color:#fff;} .step.done{border-color:var(--static);}
  .stat{font-size:12px;color:var(--sub);margin-top:8px;line-height:1.7;} .stat.ok{color:var(--static);} .stat.err{color:#a8503a;}
  table{width:100%;border-collapse:collapse;margin:8px 0;font-size:13px;}
  th,td{text-align:left;padding:4px 8px;border-bottom:1px solid var(--bd);vertical-align:top;}
  th{color:var(--sub);font-weight:500;} td.r,th.r{text-align:right;}
  .sec{background:var(--panel);border:1px solid var(--bd);border-radius:12px;padding:14px 16px;margin-bottom:14px;}
  .sec h3{font-size:15px;margin:0 0 6px;}
  .big{font-size:20px;font-weight:700;}
  .pill{display:inline-block;border-radius:9px;padding:1px 9px;font-size:12px;margin-right:6px;}
  .pill.warn{background:#fcf4d2;color:#7a5230;} .pill.bad{background:#f6dcd6;color:#a33;} .pill.ok{background:#e2efe3;color:#3a6b40;}
  .note{font-size:12px;color:var(--sub);line-height:1.8;}
  .miss{color:#a8503a;} .extra{color:var(--accent);} .small{font-size:12px;color:var(--sub);}
  details{margin:6px 0;} summary{cursor:pointer;font-weight:600;font-size:13px;}
</style>
</head>
<body>
<header><h1>移植比對：rbf1（為準）→ rbf2 套裝　<span style="font-size:12px;color:#9a8f7d;font-weight:400;">三層 diff</span></h1></header>
<div class="wrap">
  <div class="note" style="margin-bottom:12px;">以 rbf1 原有條件為基準,檢查 rbf2 套裝:① 每維度卡片數 → ② 相同卡片的題目 → ③ 相同卡片相同題目的選項。條件比對<b>不管 AND/OR/NOT</b>,只看「用到哪些觀察題＋哪些值」。</div>

  <div class="step" id="s1"><h2><span class="num">1</span>讀取 rbf1</h2><div class="stat" id="st1">讀取中…</div></div>
  <div class="step" id="s2"><h2><span class="num">2</span>登入 P2</h2><button class="btn primary" id="b2">用 Google 登入</button><button class="btn" id="b2out" style="display:none">登出</button><div class="stat" id="st2">尚未登入。</div></div>
  <div class="step" id="s3"><h2><span class="num">3</span>選 rbf2 套裝</h2><select id="rs-sel"><option>（先登入）</option></select><div class="stat" id="st3">預設挑「202605／人相兵法」。</div></div>
  <div class="step" id="s4"><h2><span class="num">4</span>比對</h2><button class="btn primary" id="b4" disabled>開始比對</button><div class="stat" id="st4">請先完成 1–3。</div></div>
  <div id="report"></div>
</div>

<script src="js/dims_meta.js"></script>
<script src="js/observations_data.js"></script>
<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js';
import { getAuth, GoogleAuthProvider, signInWithPopup, signOut, onAuthStateChanged } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js';
import { getFirestore, doc, getDoc, getDocs, collection } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js';

const P2_CFG = { apiKey:'AIzaSyDZ3z9LV1g3rnhO0QjmYOfipUGMtD1cq7g', authDomain:'rbf2app-staging.firebaseapp.com', projectId:'rbf2app-staging', storageBucket:'rbf2app-staging.firebasestorage.app', messagingSenderId:'565853308902', appId:'1:565853308902:web:8a7a3e63df1291124df827' };
const app = initializeApp(P2_CFG, 'cmp'), auth = getAuth(app), db = getFirestore(app);
const P1_URL = 'https://firestore.googleapis.com/v1/projects/renxiangbingfa/databases/(default)/documents/settings/rules?key=AIzaSyCZUzTOaCtbzXuX_mz5VoFvZ2Sva1Obza8';
const META = (window.DIMS_META && window.DIMS_META.dims) || [];
const OBS = {}; (window.OBSERVATIONS || []).forEach(o => OBS[o.obsId] = o);
const lab = ref => (OBS[ref] && OBS[ref].label) ? OBS[ref].label : ref;
const $ = id => document.getElementById(id);

let rbf1 = null, user = null, role = null, sets = [];

// rbf1：{di:{part:{groupName:{ref:Set(values)}}}}
function addCond(map, ref, match) { if (!map[ref]) map[ref] = new Set(); (Array.isArray(match) ? match : (match != null ? [match] : [])).forEach(v => map[ref].add(v)); }
function leavesUnder(node, cb) { if (Array.isArray(node)) node.forEach(n => leavesUnder(n, cb)); else if (node && typeof node === 'object') { if (node.ref) cb(node.ref, node.match); Object.keys(node).forEach(k => { if (k !== 'group') leavesUnder(node[k], cb); }); } }
async function loadRbf1() {
  $('st1').className = 'stat'; $('st1').textContent = '讀取中…';
  try {
    const d = await (await fetch(P1_URL)).json();
    const R = JSON.parse(d.fields.rulesJson.stringValue);
    rbf1 = {}; let groups = 0;
    R.forEach(dim => {
      const di = dim.dimIndex; rbf1[di] = {};
      Object.keys(dim.parts || {}).forEach(pn => {
        const walk = (node) => {
          if (Array.isArray(node)) node.forEach(walk);
          else if (node && typeof node === 'object') {
            if (node.group) { if (!rbf1[di][pn]) rbf1[di][pn] = {}; const m = rbf1[di][pn][node.group] || (rbf1[di][pn][node.group] = {}); leavesUnder(node, (r, mt) => addCond(m, r, mt)); groups++; }
            Object.values(node).forEach(walk);
          }
        };
        walk(dim.parts[pn]);
      });
    });
    $('st1').className = 'stat ok'; $('st1').textContent = '✓ rbf1 讀到 ' + groups + ' 組敘述分組。'; $('s1').classList.add('done');
  } catch (e) { $('st1').className = 'stat err'; $('st1').textContent = '讀取失敗：' + (e.message || e); }
  refresh();
}

$('b2').onclick = () => signInWithPopup(auth, new GoogleAuthProvider()).catch(e => $('st2').textContent = '登入失敗：' + (e.code || e.message));
$('b2out').onclick = () => signOut(auth);
onAuthStateChanged(auth, async u => {
  user = u; role = null;
  if (u) { const email = (u.email || '').toLowerCase(); try { const s = await getDoc(doc(db, 'allowedUsers', email)); if (s.exists()) role = s.data().role || null; } catch (e) {} if (email === 'chaojentseng@gmail.com') role = 'admin'; await loadSets(); }
  refresh();
});
async function loadSets() {
  try {
    const snap = await getDocs(collection(db, 'ruleSets')); sets = []; snap.forEach(d => sets.push({ id: d.id, ...d.data() }));
    sets.sort((a, b) => (b.createdAt || '').localeCompare(a.createdAt || ''));
    const sel = $('rs-sel'); sel.innerHTML = '';
    sets.forEach(s => sel.appendChild(new Option((s.name || s.id) + (s.status === 'archived' ? '（封存）' : ''), s.id)));
    const pick = sets.filter(s => /202605|人相兵法/.test(s.name || ''))[0] || sets[0];
    if (pick) sel.value = pick.id;
  } catch (e) { $('st3').className = 'stat err'; $('st3').textContent = '讀套裝失敗：' + (e.code || e.message); }
}
function refresh() {
  $('b2').style.display = user ? 'none' : ''; $('b2out').style.display = user ? '' : 'none';
  $('st2').textContent = user ? ('已登入：' + (user.email || user.uid) + '｜角色：' + (role || '（無）')) : '尚未登入。';
  $('s2').classList.toggle('done', !!user);
  $('b4').disabled = !(rbf1 && user && $('rs-sel').value);
}

// rbf2：讀套裝 dims → {di:{part:{cardLabel:{ref:Set(values)}}}}
async function readRbf2(setId) {
  const snap = await getDocs(collection(db, 'ruleSets', setId, 'dims'));
  const out = {};
  snap.forEach(d => {
    const dd = d.data(); const di = +dd.dimIndex; out[di] = {};
    const parts = dd.parts || {};
    Object.keys(parts).forEach(pn => {
      const p = parts[pn]; if (!p || !Array.isArray(p.cards)) return;
      out[di][pn] = {};
      p.cards.forEach(c => {
        const m = out[di][pn][c.label] || (out[di][pn][c.label] = {});
        (c.combos || []).forEach(cb => { const leaves = Array.isArray(cb) ? cb : (cb && cb.leaves) || []; leaves.forEach(l => addCond(m, l.ref, l.match)); });
      });
    });
  });
  return out;
}
const setEq = (a, b) => a.size === b.size && [...a].every(x => b.has(x));
const fmtSet = s => [...s].join('／') || '（空）';

$('b4').onclick = async () => {
  const setId = $('rs-sel').value; const setName = (sets.filter(s => s.id === setId)[0] || {}).name || setId;
  $('st4').className = 'stat'; $('st4').textContent = '讀取 rbf2 並比對中…'; $('report').innerHTML = '';
  let rbf2; try { rbf2 = await readRbf2(setId); } catch (e) { $('st4').className = 'stat err'; $('st4').textContent = '讀 rbf2 失敗：' + (e.code || e.message); return; }

  const L1 = [], L2 = [], L3 = [];
  let r1cards = 0, r2cards = 0, common = 0, unfilled = 0, qDiff = 0, vDiff = 0;
  for (let di = 0; di < 13; di++) {
    const p1 = rbf1[di] || {}, p2 = rbf2[di] || {};
    const parts = [...new Set([...Object.keys(p1), ...Object.keys(p2)])];
    let d1 = 0, d2 = 0; const onlyR1 = [], onlyR2 = [];
    parts.forEach(pn => {
      const g1 = p1[pn] || {}, g2 = p2[pn] || {};
      const names = [...new Set([...Object.keys(g1), ...Object.keys(g2)])];
      names.forEach(nm => {
        const inR1 = nm in g1, inR2 = nm in g2;
        if (inR1) d1++; if (inR2) d2++;
        if (inR1 && !inR2) onlyR1.push(pn + '／' + nm);
        else if (!inR1 && inR2) onlyR2.push(pn + '／' + nm);
        else if (inR1 && inR2) {
          common++;
          const c1 = g1[nm], c2 = g2[nm];
          const refs2 = Object.keys(c2);
          if (!refs2.length) { unfilled++; return; }   // rbf2 尚未填
          // ② 題目 ref 差異
          const r1set = new Set(Object.keys(c1)), r2set = new Set(refs2);
          const miss = [...r1set].filter(r => !r2set.has(r)), extra = [...r2set].filter(r => !r1set.has(r));
          if (miss.length || extra.length) { qDiff++; L2.push({ di, pn, nm, miss, extra }); }
          // ③ 共同 ref 的選項值差異
          [...r1set].filter(r => r2set.has(r)).forEach(r => { if (!setEq(c1[r], c2[r])) { vDiff++; L3.push({ di, pn, nm, ref: r, v1: c1[r], v2: c2[r] }); } });
        }
      });
    });
    r1cards += d1; r2cards += d2;
    if (d1 !== d2 || onlyR1.length || onlyR2.length) L1.push({ di, d1, d2, onlyR1, onlyR2 });
  }

  const dn = META.length || 13;
  let html = '<div class="sec"><h3>總覽 — ' + setName + '</h3>' +
    '<div>rbf1 共 <b class="big">' + r1cards + '</b> 組　·　rbf2 共 <b class="big">' + r2cards + '</b> 卡　·　共同卡片 ' + common + ' 張</div>' +
    '<div style="margin-top:8px">' +
    '<span class="pill ' + (L1.length ? 'warn' : 'ok') + '">卡片數差異：' + L1.length + ' 維</span>' +
    '<span class="pill warn">尚未填：' + unfilled + ' 張</span>' +
    '<span class="pill ' + (qDiff ? 'bad' : 'ok') + '">題目不一致：' + qDiff + ' 張</span>' +
    '<span class="pill ' + (vDiff ? 'bad' : 'ok') + '">選項不一致：' + vDiff + ' 處</span>' +
    '</div></div>';

  // ① 卡片數
  html += '<div class="sec"><h3>① 每維度卡片數</h3>';
  if (!L1.length) html += '<div class="note">全部維度卡片數一致 ✓</div>';
  else {
    html += '<table><tr><th>維度</th><th class="r">rbf1</th><th class="r">rbf2</th><th>只在 rbf1（缺）</th><th>只在 rbf2（多）</th></tr>';
    L1.forEach(x => { html += '<tr><td>dim' + x.di + ' ' + ((META[x.di] || {}).name || '') + '</td><td class="r">' + x.d1 + '</td><td class="r">' + x.d2 + '</td><td class="miss small">' + (x.onlyR1.join('、') || '—') + '</td><td class="extra small">' + (x.onlyR2.join('、') || '—') + '</td></tr>'; });
    html += '</table>';
  }
  html += '</div>';

  // ② 題目不一致
  html += '<div class="sec"><h3>② 題目不一致（相同卡片，用到的觀察題不同）</h3>';
  if (!L2.length) html += '<div class="note">已填的卡片中，題目都與 rbf1 一致 ✓</div>';
  else { html += '<table><tr><th>維度／部位／卡片</th><th>缺（rbf1有, rbf2無）</th><th>多（rbf2有, rbf1無）</th></tr>'; L2.forEach(x => { html += '<tr><td>dim' + x.di + ' ' + x.pn + '／' + x.nm + '</td><td class="miss small">' + (x.miss.map(lab).join('、') || '—') + '</td><td class="extra small">' + (x.extra.map(lab).join('、') || '—') + '</td></tr>'; }); html += '</table>'; }
  html += '</div>';

  // ③ 選項不一致
  html += '<div class="sec"><h3>③ 選項不一致（相同卡片相同題目，選的值不同）</h3>';
  if (!L3.length) html += '<div class="note">共同題目的選項都與 rbf1 一致 ✓</div>';
  else { html += '<table><tr><th>維度／部位／卡片</th><th>題目</th><th>rbf1</th><th>rbf2</th></tr>'; L3.forEach(x => { html += '<tr><td>dim' + x.di + ' ' + x.pn + '／' + x.nm + '</td><td>' + lab(x.ref) + '</td><td class="small">' + fmtSet(x.v1) + '</td><td class="small">' + fmtSet(x.v2) + '</td></tr>'; }); html += '</table>'; }
  html += '</div>';

  $('report').innerHTML = html;
  $('st4').className = 'stat ok'; $('st4').textContent = '✓ 比對完成。'; $('s4').classList.add('done');
};

loadRbf1();
refresh();
</script>
</body>
</html>
