<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>總動靜 radar3 手機版 試做（radar3_m）</title>
<style>
  :root{--static:#7A9E7E;--active:#C17A5A;--text:#3d3b39;--text3:#9a9188;--bg:#f7f4ef;--card:#fffdfa;--border:#e7ded2;
        --cream-deep:#cdb892;--cream-bg:#f0e9dc;--cream-text:#7d6643}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);font-family:'Noto Sans TC','PingFang TC',sans-serif;color:var(--text);padding:14px}
  .wrap{max-width:390px;margin:0 auto}
  .sub{font-size:12px;color:var(--text3);text-align:center;margin:0 0 8px;line-height:1.6}
  .phone{max-width:360px;margin:0 auto;background:var(--card);border:1px solid var(--border);border-radius:14px;padding:8px;box-shadow:0 1px 6px rgba(0,0,0,0.06)}
  svg{display:block;width:100%;height:auto}
  .ctl{margin-top:12px}
  .row{display:flex;align-items:center;gap:8px;font-size:13px;margin:7px 0}
  .row label{flex:0 0 130px;color:var(--text)}
  .row input[type=range]{flex:1}
  .row b{flex:0 0 44px;text-align:right;font-family:monospace;color:var(--active)}
  textarea{width:100%;height:150px;font-family:monospace;font-size:12px;border:1px solid var(--border);border-radius:8px;padding:6px;background:var(--card);color:var(--text);margin-top:8px}
  button{padding:7px 16px;border:1px solid var(--border);border-radius:8px;background:var(--card);font-size:13px;cursor:pointer}
</style>
</head>
<body>
<div class="wrap">
  <div class="sub">總動靜（radar3）手機版預覽<br><b>可拖曳</b>：維度名、先天/運氣/後天 中央字。下方滑桿調字級</div>
  <div class="phone">
    <svg id="poly" viewBox="0 -34 400 458" aria-label="總動靜 手機版"></svg>
  </div>
  <div class="ctl">
    <div class="row"><label>維度名字級</label><input id="sName" type="range" min="6" max="22" step="0.5" value="10.8"><b id="vName">10.8</b></div>
    <div class="row"><label>係數數字字級</label><input id="sNum" type="range" min="6" max="20" step="0.5" value="10.8"><b id="vNum">10.8</b></div>
    <div class="row"><label>動/靜極字（如圓6）</label><input id="sPole" type="range" min="6" max="20" step="0.5" value="10"><b id="vPole">10.0</b></div>
    <div class="row"><label>中央先天運氣後天</label><input id="sCore" type="range" min="6" max="22" step="0.5" value="10.8"><b id="vCore">10.8</b></div>
    <textarea id="out" readonly></textarea>
    <button id="copyBtn">複製設定</button>
    <button id="resetBtn" style="margin-left:6px">歸位</button>
  </div>
</div>
<script>
function getC(v){return getComputedStyle(document.documentElement).getPropertyValue(v).trim();}
const S=getC('--static'),A=getC('--active'),CRBG=getC('--cream-bg');
const Sd='#4f6f53', Ad='#8f5236';
const DIMS=[
  {dn:'形勢',j:5,c:0.13,jc:'形',dc:'勢'},{dn:'經緯',j:1,c:0.29,jc:'經',dc:'緯'},{dn:'方圓',j:3,c:0.80,jc:'方',dc:'圓'},
  {dn:'曲直',j:0,c:0.00,jc:'直',dc:'曲'},{dn:'收放',j:5,c:0.29,jc:'收',dc:'放'},{dn:'緩急',j:5,c:0.50,jc:'緩',dc:'急'},
  {dn:'順逆',j:7,c:0.50,jc:'順',dc:'逆'},{dn:'分合',j:3,c:0.29,jc:'合',dc:'分'},{dn:'真假',j:9,c:0.80,jc:'真',dc:'假'},
  {dn:'攻守',j:0,c:0.80,jc:'守',dc:'攻'},{dn:'奇正',j:4,c:0.50,jc:'正',dc:'奇'},{dn:'虛實',j:3,c:0.50,jc:'實',dc:'虛'},{dn:'進退',j:2,c:0.13,jc:'退',dc:'進'}
];
DIMS.forEach(d=>d.d=9-d.j);
const DIMTXT=['#4A6B3A','#3A5E54','#6A6458','#7A5A38','#7A4858','#7A6A38','#3A5A7A','#5A4870','#3A6A4A','#3A6B3A','#5A4068','#3A6058','#3A5870'];
const STEP=360/13;
const spans=[];for(let i=0;i<13;i++)spans.push([i*STEP,(i+1)*STEP]);
const cx=200,cy=215,U=150/9,rIn=4*U,rOut=9*U,H=rOut-rIn;
const coreR=42, RING1=57;
const rad=d=>d*Math.PI/180;
const f=(deg,r)=>[cx+r*Math.sin(rad(deg)),cy-r*Math.cos(rad(deg))];
const PS=p=>p[0].toFixed(2)+','+p[1].toFixed(2);
const facet=(a0,a1,ra,rb)=>`M ${PS(f(a0,ra))} L ${PS(f(a0,rb))} L ${PS(f(a1,rb))} L ${PS(f(a1,ra))} Z`;
// 維度名位置（已定案）；中央三字位置（已定案）
const R3_DIMPOS=[[13.9,2.477],[38.7,2.404],[67.4,2.331],[97.3,2.246],[128.8,2.319],[155.4,2.424],[180.0,2.436],[206.0,2.392],[232.3,2.334],[262.6,2.233],[293.5,2.316],[319.7,2.407],[345.6,2.454]];
const R3_CORELABELS=[['先天',87.1,0.290],['運氣',207.7,0.347],['後天',304.0,0.328]];

// ===== 拖曳支援 =====
let OFF={}, LABELS={};
function reg(key,x,y,fs,meta){LABELS[key]={x:x,y:y,fs:fs,meta:meta||{}};}
function hit(x,y,w,h){return `<rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${w.toFixed(1)}" height="${h.toFixed(1)}" fill="transparent" pointer-events="all"/>`;}

function buildSVG(P){
  const fsName=P.fsName, fsNum=P.fsNum, fsPole=P.fsPole, fsCore=P.fsCore;
  LABELS={};
  let svg='';
  // 最外圍淡灰 13 邊形
  svg+=`<polygon points="${spans.map(s=>PS(f(s[0],rOut))).join(' ')}" fill="none" stroke="#e6ddd0" stroke-width="1"/>`;
  // 資料環：面積比例切，靜1(1/9)→57
  DIMS.forEach((dm,i)=>{const[a0,a1]=spans[i];const rS=(dm.j===1)?RING1:Math.sqrt(dm.j/9)*rOut;
    svg+=`<path d="${facet(a0,a1,0,rS)}" fill="${S}" fill-opacity="0.55"/>`;
    svg+=`<path d="${facet(a0,a1,rS,rOut)}" fill="${A}" fill-opacity="0.55"/>`;});
  // 白色輻線
  spans.forEach(s=>{const p=f(s[0],rOut);svg+=`<line x1="${cx}" y1="${cy}" x2="${p[0].toFixed(1)}" y2="${p[1].toFixed(1)}" stroke="#fff" stroke-width="1"/>`;});
  // 8 條參考環
  for(let st=1; st<=8; st++){const r=(st===1)?RING1:rOut*Math.sqrt(st/9);
    svg+=`<polygon points="${spans.map(s=>PS(f(s[0],r))).join(' ')}" fill="none" stroke="#fff" stroke-opacity="0.3" stroke-width="0.7"/>`;}
  // 群組分隔線
  [[0,'#936A78'],[3*STEP,'#898179'],[6*STEP,'#546D77'],[9*STEP,'#797181']].forEach(([a,col])=>{const p1=f(a,rOut);svg+=`<line x1="${cx}" y1="${cy}" x2="${p1[0].toFixed(1)}" y2="${p1[1].toFixed(1)}" stroke="${col}" stroke-width="2"/>`;});
  // 中央 13 邊形：米色填滿 + 先天/運氣/後天 分隔線
  svg+=`<polygon points="${spans.map(s=>PS(f(s[0],coreR))).join(' ')}" fill="${CRBG}"/>`;
  [0,6*STEP,9*STEP].forEach(a=>{const p=f(a,coreR);svg+=`<line x1="${cx}" y1="${cy}" x2="${p[0].toFixed(1)}" y2="${p[1].toFixed(1)}" stroke="#b09a6a" stroke-width="1.2"/>`;});
  svg+=`<polygon points="${spans.map(s=>PS(f(s[0],coreR))).join(' ')}" fill="none" stroke="#cdb892" stroke-width="0.8"/>`;
  // 主導極字 + 數量（fsPole）
  const rInner=rIn+0.25*H, rOuter=rIn+0.75*H;
  DIMS.forEach((dm,i)=>{const mid=(spans[i][0]+spans[i][1])/2;const jDom=dm.j>dm.d;
    if(jDom){const p=f(mid,rInner);svg+=`<text x="${p[0].toFixed(1)}" y="${(p[1]+fsPole*0.35).toFixed(1)}" font-size="${fsPole}" text-anchor="middle" fill="${Sd}" font-weight="700">${dm.jc}${dm.j}</text>`;}
    else{const p=f(mid,rOuter);svg+=`<text x="${p[0].toFixed(1)}" y="${(p[1]+fsPole*0.35).toFixed(1)}" font-size="${fsPole}" text-anchor="middle" fill="${Ad}" font-weight="700">${dm.dc}${dm.d}</text>`;}});
  // 維度名 + 係數（可拖曳）
  DIMS.forEach((dm,i)=>{const dp=R3_DIMPOS[i];const lp=f(dp[0],rIn*dp[1]);const c=Math.sin(rad(dp[0]));const an=c>0.25?'start':c<-0.25?'end':'middle';const col=DIMTXT[i];const nm=dm.dn;const tl=(nm.length*fsName).toFixed(1);
    const key='名:'+nm;reg(key,lp[0],lp[1],fsName,{type:'name',i:i,dn:nm});
    const w=nm.length*fsName, hx=an==='start'?lp[0]-2:an==='end'?lp[0]-w-2:lp[0]-w/2-2;
    svg+=`<g class="drg" data-key="${key}">${hit(hx,lp[1]-fsName*0.95,w+4,fsName+fsNum+4)}`
      +`<text x="${lp[0].toFixed(1)}" y="${lp[1].toFixed(1)}" font-size="${fsName}" text-anchor="${an}" fill="${col}" fill-opacity="0.8" font-weight="600">${nm}</text>`
      +`<text x="${lp[0].toFixed(1)}" y="${(lp[1]+fsName+1).toFixed(1)}" font-size="${fsNum}" textLength="${tl}" lengthAdjust="spacingAndGlyphs" text-anchor="${an}" fill="${col}" fill-opacity="0.8" font-family="'Helvetica Neue',Arial,sans-serif" font-weight="600">${dm.c.toFixed(2)}</text></g>`;});
  // 中央 先天/運氣/後天（深米色，可拖曳）
  R3_CORELABELS.forEach(([nm,deg,fr])=>{const p=f(deg,rIn*fr);const key=nm;reg(key,p[0],p[1],fsCore,{type:'core',nm:nm});
    const w=nm.length*fsCore;
    svg+=`<g class="drg" data-key="${key}">${hit(p[0]-w/2,p[1]-fsCore*0.9,w,fsCore*1.4)}`
      +`<text x="${p[0].toFixed(1)}" y="${(p[1]+fsCore*0.3).toFixed(1)}" font-size="${fsCore}" text-anchor="middle" fill="#8a7440" font-weight="700">${nm}</text></g>`;});
  return svg;
}

const poly=document.getElementById('poly');
const sName=document.getElementById('sName'),sNum=document.getElementById('sNum'),sPole=document.getElementById('sPole'),sCore=document.getElementById('sCore');
const vName=document.getElementById('vName'),vNum=document.getElementById('vNum'),vPole=document.getElementById('vPole'),vCore=document.getElementById('vCore');
const DEF={fsName:10.8,fsNum:10.8,fsPole:10,fsCore:10.8};
function readP(){return{fsName:parseFloat(sName.value),fsNum:parseFloat(sNum.value),fsPole:parseFloat(sPole.value),fsCore:parseFloat(sCore.value)};}

function applyOff(){for(const k in LABELS){const o=OFF[k];const g=poly.querySelector(`.drg[data-key="${CSS.escape(k)}"]`);if(g){if(o&&(o.dx||o.dy))g.setAttribute('transform',`translate(${o.dx.toFixed(1)},${o.dy.toFixed(1)})`);else g.removeAttribute('transform');}}}
function readout(){
  const P=readP();
  let lines=[`維度名字級 = ${P.fsName}`,`係數數字字級 = ${P.fsNum}`,`動/靜極字 = ${P.fsPole}`,`中央先天運氣後天 = ${P.fsCore}`];
  let moved=[];
  for(const k in OFF){const o=OFF[k];if(!o||(Math.abs(o.dx)<0.1&&Math.abs(o.dy)<0.1))continue;const L=LABELS[k];if(!L)continue;const m=L.meta;
    const X=L.x+o.dx,Y=L.y+o.dy,dx=X-cx,dy=Y-cy;let deg=Math.atan2(dx,-dy)*180/Math.PI;if(deg<0)deg+=360;const fr=Math.hypot(dx,dy)/rIn;
    if(m.type==='name')moved.push(`R3_DIMPOS[${m.i}] /*${m.dn}*/ = [${deg.toFixed(1)}, ${fr.toFixed(3)}]`);
    else if(m.type==='core')moved.push(`${m.nm} = f(${deg.toFixed(1)}, rIn*${fr.toFixed(3)})`);}
  if(moved.length)lines.push('','[已移動]',...moved);
  document.getElementById('out').value=lines.join('\n');
}
function render(){
  const P=readP();
  vName.textContent=P.fsName.toFixed(1);vNum.textContent=P.fsNum.toFixed(1);vPole.textContent=P.fsPole.toFixed(1);vCore.textContent=P.fsCore.toFixed(1);
  poly.innerHTML=buildSVG(P);
  bindDrag();applyOff();readout();
}
// 拖曳（移動）
let mode=null,curKey=null,start=null,baseOff=null;
function toSvg(e){const pt=poly.createSVGPoint();const t=e.touches?e.touches[0]:e;pt.x=t.clientX;pt.y=t.clientY;return pt.matrixTransform(poly.getScreenCTM().inverse());}
function down(e){e.preventDefault();mode='move';curKey=e.currentTarget.dataset.key;const o=OFF[curKey]||{dx:0,dy:0};baseOff={dx:o.dx,dy:o.dy};const p=toSvg(e);start={x:p.x,y:p.y};}
function moveEv(e){if(!mode)return;e.preventDefault();const p=toSvg(e);const dx=baseOff.dx+(p.x-start.x),dy=baseOff.dy+(p.y-start.y);OFF[curKey]={dx:dx,dy:dy};
  const g=poly.querySelector(`.drg[data-key="${CSS.escape(curKey)}"]`);if(g)g.setAttribute('transform',`translate(${dx.toFixed(1)},${dy.toFixed(1)})`);
  readout();}
function up(){mode=null;curKey=null;}
function bindDrag(){poly.querySelectorAll('.drg').forEach(g=>{g.style.cursor='move';g.addEventListener('mousedown',down);g.addEventListener('touchstart',down,{passive:false});});}
window.addEventListener('mousemove',moveEv);window.addEventListener('touchmove',moveEv,{passive:false});
window.addEventListener('mouseup',up);window.addEventListener('touchend',up);

[sName,sNum,sPole,sCore].forEach(el=>el.addEventListener('input',render));
document.getElementById('copyBtn').addEventListener('click',function(){const ta=document.getElementById('out');ta.select();try{document.execCommand('copy');}catch(e){}this.textContent='已複製';const b=this;setTimeout(()=>b.textContent='複製設定',1200);});
document.getElementById('resetBtn').addEventListener('click',function(){sName.value=DEF.fsName;sNum.value=DEF.fsNum;sPole.value=DEF.fsPole;sCore.value=DEF.fsCore;OFF={};render();});
render();
</script>
</body>
</html>
