<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>一目了然扇形圖 試做</title>
<style>
  :root{--static:#7A9E7E;--active:#C17A5A;--text:#3d3b39;--text3:#9a9188;--bg:#f7f4ef;--card:#fffdfa;--border:#e7ded2}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);font-family:'Noto Sans TC','PingFang TC',sans-serif;color:var(--text);padding:14px}
  .wrap{max-width:460px;margin:0 auto}
  .title{font-size:18px;font-weight:700;letter-spacing:2px;text-align:center;margin:4px 0 2px}
  .sub{font-size:12px;color:var(--text3);text-align:center;margin-bottom:10px;line-height:1.6}
  .card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:8px;box-shadow:0 1px 4px rgba(0,0,0,0.04)}
  svg{display:block;width:100%;height:auto}
  .legend{display:flex;gap:18px;justify-content:center;font-size:12px;color:var(--text3);margin-top:4px}
  .legend i{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:5px;vertical-align:-1px}
</style>
</head>
<body>
<div class="wrap">
  <div class="title">人相兵法 · 一目了然</div>
  <div class="sub">（試做 · 假資料）每個維度一扇形：綠＝靜數（內）／橘＝動數（外），半徑 0~9</div>
  <div class="card">
    <svg id="rose" viewBox="0 0 400 470" aria-label="13維度扇形圖"></svg>
    <div class="legend"><span><i style="background:var(--static)"></i>靜</span><span><i style="background:var(--active)"></i>動</span></div>
  </div>
</div>
<script>
function getC(v){return getComputedStyle(document.documentElement).getPropertyValue(v).trim();}
const S=getC('--static'), A=getC('--active');

// 順時針從 12 點：右上(0-90) 形勢經緯方圓 / 右下(90-180) 曲直收放緩急
//               左下(180-270) 順逆分合真假 / 左上(270-360) 攻守奇正虛實進退
// {dn, j:靜數, d:動數, c:係數}（假資料）
const DIMS=[
  {dn:'形勢',j:2,d:7,c:0.29}, {dn:'經緯',j:5,d:3,c:0.51}, {dn:'方圓',j:6,d:3,c:0.40},
  {dn:'曲直',j:3,d:5,c:0.22}, {dn:'收放',j:4,d:5,c:0.45}, {dn:'緩急',j:7,d:2,c:0.38},
  {dn:'順逆',j:5,d:4,c:0.30}, {dn:'分合',j:3,d:6,c:0.33}, {dn:'真假',j:6,d:2,c:0.41},
  {dn:'攻守',j:2,d:7,c:0.55}, {dn:'奇正',j:5,d:4,c:0.48}, {dn:'虛實',j:4,d:4,c:0.36}, {dn:'進退',j:6,d:3,c:0.60}
];
const QUADS=[{name:'老闆',mid:45},{name:'主管',mid:135},{name:'運氣',mid:225},{name:'後天',mid:315}];
const sizes=[30,30,30, 30,30,30, 30,30,30, 22.5,22.5,22.5,22.5];
const spans=[]; let acc=0;
for(let i=0;i<13;i++){spans.push([acc,acc+sizes[i]]);acc+=sizes[i];}

const cx=200, cy=210, R=140, MAX=9, u=R/MAX;
const rad=deg=>deg*Math.PI/180;
const f=(deg,r)=>[ (cx+r*Math.sin(rad(deg))).toFixed(2), (cy-r*Math.cos(rad(deg))).toFixed(2) ];
function annular(a0,a1,rIn,rOut){
  const o0=f(a0,rOut),o1=f(a1,rOut),i1=f(a1,rIn),i0=f(a0,rIn);
  if(rIn<=0.01) return `M${cx} ${cy} L${o0[0]} ${o0[1]} A${rOut} ${rOut} 0 0 1 ${o1[0]} ${o1[1]} Z`;
  return `M${o0[0]} ${o0[1]} A${rOut} ${rOut} 0 0 1 ${o1[0]} ${o1[1]} L${i1[0]} ${i1[1]} A${rIn} ${rIn} 0 0 0 ${i0[0]} ${i0[1]} Z`;
}
let svg='';
// 刻度圈 1~9（淡、不搶視覺）
for(let k=1;k<=MAX;k++){
  svg+=`<circle cx="${cx}" cy="${cy}" r="${(k*u).toFixed(1)}" fill="none" stroke="#efe9df" stroke-width="${k===MAX?1:0.6}"/>`;
}
// 象限分隔線（淡）
[0,90,180,270].forEach(a=>{const p=f(a,R);svg+=`<line x1="${cx}" y1="${cy}" x2="${p[0]}" y2="${p[1]}" stroke="#ece4d8" stroke-width="1"/>`;});
// 維度扇形：綠(靜)內 + 橘(動)外
DIMS.forEach((dm,i)=>{
  const[a0,a1]=spans[i];
  const rJ=dm.j*u, rD=(dm.j+dm.d)*u;
  if(dm.j>0) svg+=`<path d="${annular(a0,a1,0,rJ)}" fill="${S}" fill-opacity="0.92" stroke="#fff" stroke-width="1.2"/>`;
  if(dm.d>0) svg+=`<path d="${annular(a0,a1,rJ,rD)}" fill="${A}" fill-opacity="0.92" stroke="#fff" stroke-width="1.2"/>`;
});
// 維度名 + 係數（圓外，雷達式）
DIMS.forEach((dm,i)=>{
  const[a0,a1]=spans[i]; const mid=(a0+a1)/2;
  const lp=f(mid,R+16); const c=Math.sin(rad(mid)); const anchor=c>0.25?'start':c<-0.25?'end':'middle';
  svg+=`<text x="${lp[0]}" y="${lp[1]}" font-size="12" text-anchor="${anchor}" fill="var(--text)" font-weight="600">${dm.dn}</text>`;
  svg+=`<text x="${lp[0]}" y="${(parseFloat(lp[1])+13).toFixed(1)}" font-size="11" text-anchor="${anchor}" fill="var(--text3)" font-family="monospace">${dm.c.toFixed(2)}</text>`;
});
// 象限標籤（角落，淡）
QUADS.forEach(q=>{const lp=f(q.mid,R+50);const c=Math.sin(rad(q.mid));const anchor=c>0.25?'start':c<-0.25?'end':'middle';
  svg+=`<text x="${lp[0]}" y="${lp[1]}" font-size="12" text-anchor="${anchor}" fill="#c3b8a8" font-weight="700" letter-spacing="1">${q.name}</text>`;});
document.getElementById('rose').innerHTML=svg;
</script>
</body>
</html>
