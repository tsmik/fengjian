<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>一目了然 試做</title>
<style>
  :root{--static:#7A9E7E;--active:#C17A5A;--text:#3d3b39;--text3:#9a9188;--bg:#f7f4ef;--card:#fffdfa;--border:#e7ded2;
        --cream-deep:#cdb892;--cream-bg:#f0e9dc;--cream-text:#7d6643}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);font-family:'Noto Sans TC','PingFang TC',sans-serif;color:var(--text);padding:14px}
  .wrap{max-width:460px;margin:0 auto}
  .title{font-size:18px;font-weight:700;letter-spacing:2px;text-align:center;margin:4px 0 2px}
  .sub{font-size:12px;color:var(--text3);text-align:center;margin-bottom:10px;line-height:1.6}
  .card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:8px;box-shadow:0 1px 4px rgba(0,0,0,0.04)}
  svg{display:block;width:100%;height:auto}
  .legend{display:flex;gap:18px;justify-content:center;font-size:12px;color:var(--text3);margin-top:4px}
  .legend i{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:5px;vertical-align:-1px}
</style>
</head>
<body>
<div class="wrap">
  <div class="title">人相兵法 · 一目了然</div>
  <div class="sub">（案例數據；係數為假）資料環依靜:動比；只標主導極字（靜多在內/動多在外）；白線＝平衡參考</div>
  <div class="card">
    <svg id="poly" viewBox="0 0 400 470" aria-label="一目了然圖"></svg>
    <div class="legend"><span><i style="background:var(--static)"></i>靜</span><span><i style="background:var(--active)"></i>動</span></div>
  </div>
</div>
<script>
function getC(v){return getComputedStyle(document.documentElement).getPropertyValue(v).trim();}
const S=getC('--static'),A=getC('--active');
const CRD=getC('--cream-deep'),CRBG=getC('--cream-bg'),CRT=getC('--cream-text');
const Sm='#90b094', Am='#cc9173', Sd='#4f6f53', Ad='#8f5236';
const DIMS=[
  {dn:'形勢',j:5,c:0.29,jc:'形',dc:'勢'},{dn:'經緯',j:1,c:0.51,jc:'經',dc:'緯'},{dn:'方圓',j:3,c:0.40,jc:'方',dc:'圓'},
  {dn:'曲直',j:0,c:0.22,jc:'直',dc:'曲'},{dn:'收放',j:5,c:0.45,jc:'收',dc:'放'},{dn:'緩急',j:5,c:0.38,jc:'緩',dc:'急'},
  {dn:'順逆',j:7,c:0.30,jc:'順',dc:'逆'},{dn:'分合',j:3,c:0.33,jc:'合',dc:'分'},{dn:'真假',j:9,c:0.41,jc:'真',dc:'假'},
  {dn:'攻守',j:0,c:0.55,jc:'守',dc:'攻'},{dn:'奇正',j:4,c:0.48,jc:'正',dc:'奇'},{dn:'虛實',j:3,c:0.36,jc:'實',dc:'虛'},{dn:'進退',j:2,c:0.60,jc:'退',dc:'進'}
];
DIMS.forEach(d=>d.d=9-d.j);
const STEP=360/13;
const spans=[];for(let i=0;i<13;i++)spans.push([i*STEP,(i+1)*STEP]);
const mean=a=>a.reduce((s,x)=>s+x,0)/a.length, co=DIMS.map(d=>d.c);
const CORE=[
  {name:'先天',a0:0,a1:6*STEP,v:mean(co.slice(0,6))},
  {name:'運氣',a0:6*STEP,a1:9*STEP,v:mean(co.slice(6,9))},
  {name:'後天',a0:9*STEP,a1:360,v:mean(co.slice(9,13))}
];
const COEF_MAX=0.8;
const cx=200,cy=215,U=150/9,rIn=4*U,rOut=9*U,H=rOut-rIn,rBal=rIn+0.5*H;
const rad=d=>d*Math.PI/180;
const f=(deg,r)=>[cx+r*Math.sin(rad(deg)),cy-r*Math.cos(rad(deg))];
const PS=p=>p[0].toFixed(2)+','+p[1].toFixed(2);
const facet=(a0,a1,ra,rb)=>`M ${PS(f(a0,ra))} L ${PS(f(a0,rb))} L ${PS(f(a1,rb))} L ${PS(f(a1,ra))} Z`;
function sector(a0,a1,r){const l=(a1-a0)>180?1:0;return `M${cx},${cy} L${PS(f(a0,r))} A${r.toFixed(1)},${r.toFixed(1)} 0 ${l} 1 ${PS(f(a1,r))} Z`;}
let svg='';
svg+=`<polygon points="${spans.map(s=>PS(f(s[0],rOut))).join(' ')}" fill="none" stroke="#e6ddd0" stroke-width="1"/>`;
// 核心 A2
svg+=`<circle cx="${cx}" cy="${cy}" r="${rIn.toFixed(1)}" fill="${CRBG}"/>`;
CORE.forEach(c=>{const r=rIn*Math.sqrt(Math.min(1,c.v/COEF_MAX));svg+=`<path d="${sector(c.a0,c.a1,r)}" fill="${CRD}"/>`;});
[0,6*STEP,9*STEP].forEach(a=>svg+=`<line x1="${cx}" y1="${cy}" x2="${f(a,rIn)[0].toFixed(1)}" y2="${f(a,rIn)[1].toFixed(1)}" stroke="#fff" stroke-width="1.5"/>`);
svg+=`<circle cx="${cx}" cy="${cy}" r="${rIn.toFixed(1)}" fill="none" stroke="#fff" stroke-width="1.5"/>`;
CORE.forEach(c=>{const mid=(c.a0+c.a1)/2;const lp=f(mid,rIn*0.42);
  svg+=`<text x="${lp[0].toFixed(1)}" y="${(lp[1]-2).toFixed(1)}" font-size="11" text-anchor="middle" fill="${CRT}" font-weight="700">${c.name}</text>`;
  svg+=`<text x="${lp[0].toFixed(1)}" y="${(lp[1]+11).toFixed(1)}" font-size="12" text-anchor="middle" fill="${CRT}" font-family="monospace" font-weight="700">${c.v.toFixed(2)}</text>`;});
// 資料環
DIMS.forEach((dm,i)=>{const[a0,a1]=spans[i];const rS=rIn+(dm.j/9)*H;
  svg+=`<path d="${facet(a0,a1,rIn,rS)}" fill="${S}" fill-opacity="0.40"/>`;
  svg+=`<path d="${facet(a0,a1,rS,rOut)}" fill="${A}" fill-opacity="0.40"/>`;});
spans.forEach(s=>svg+=`<line x1="${f(s[0],rIn)[0].toFixed(1)}" y1="${f(s[0],rIn)[1].toFixed(1)}" x2="${f(s[0],rOut)[0].toFixed(1)}" y2="${f(s[0],rOut)[1].toFixed(1)}" stroke="#fff" stroke-width="1"/>`);
svg+=`<polygon points="${spans.map(s=>PS(f(s[0],rBal))).join(' ')}" fill="none" stroke="#fff" stroke-width="0.8"/>`;
DIMS.forEach((dm,i)=>{const[a0,a1]=spans[i];const rS=rIn+(dm.j/9)*H;const g=(a1-a0)*0.04;
  const col=dm.d>dm.j?Am:Sm;const p0=f(a0+g,rS),p1=f(a1-g,rS);
  svg+=`<line x1="${p0[0].toFixed(1)}" y1="${p0[1].toFixed(1)}" x2="${p1[0].toFixed(1)}" y2="${p1[1].toFixed(1)}" stroke="${col}" stroke-width="3.2" stroke-linecap="round"/>`;});
// 只標主導極字：靜多→內圈線與平衡線中間(綠)；動多→平衡線與外圈線中間(橘)；字小
const rInner=rIn+0.25*H, rOuter=rIn+0.75*H;
DIMS.forEach((dm,i)=>{const mid=(spans[i][0]+spans[i][1])/2;
  if(dm.j>dm.d){const p=f(mid,rInner);svg+=`<text x="${p[0].toFixed(1)}" y="${(p[1]+3.5).toFixed(1)}" font-size="10" text-anchor="middle" fill="${Sd}" font-weight="700">${dm.jc}</text>`;}
  else{const p=f(mid,rOuter);svg+=`<text x="${p[0].toFixed(1)}" y="${(p[1]+3.5).toFixed(1)}" font-size="10" text-anchor="middle" fill="${Ad}" font-weight="700">${dm.dc}</text>`;}});
// 維度名+係數
DIMS.forEach((dm,i)=>{const mid=(spans[i][0]+spans[i][1])/2;const lp=f(mid,rOut+16);const c=Math.sin(rad(mid));const an=c>0.25?'start':c<-0.25?'end':'middle';
  svg+=`<text x="${lp[0].toFixed(1)}" y="${lp[1].toFixed(1)}" font-size="12" text-anchor="${an}" fill="var(--text)" font-weight="600">${dm.dn}</text>`;
  svg+=`<text x="${lp[0].toFixed(1)}" y="${(lp[1]+13).toFixed(1)}" font-size="11" text-anchor="${an}" fill="var(--text3)" font-family="monospace">${dm.c.toFixed(2)}</text>`;});
document.getElementById('poly').innerHTML=svg;
</script>
</body>
</html>
