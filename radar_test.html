<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>一目了然 試做</title>
<style>
  :root{--static:#7A9E7E;--active:#C17A5A;--pre:#8E4B50;--luck:#4C6E78;--post:#7B7082;--text:#3d3b39;--text3:#9a9188;--bg:#f7f4ef;--card:#fffdfa;--border:#e7ded2}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);font-family:'Noto Sans TC','PingFang TC',sans-serif;color:var(--text);padding:14px}
  .wrap{max-width:460px;margin:0 auto}
  .title{font-size:18px;font-weight:700;letter-spacing:2px;text-align:center;margin:4px 0 2px}
  .sub{font-size:12px;color:var(--text3);text-align:center;margin-bottom:10px;line-height:1.6}
  .card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:8px;box-shadow:0 1px 4px rgba(0,0,0,0.04)}
  svg{display:block;width:100%;height:auto}
  .legend{display:flex;gap:18px;justify-content:center;font-size:12px;color:var(--text3);margin-top:4px}
  .legend i{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:5px;vertical-align:-1px}
</style>
</head>
<body>
<div class="wrap">
  <div class="title">人相兵法 · 一目了然</div>
  <div class="sub">（試做 · 假資料）外環扇形依「靜:動」比分綠橘；交界線色＝該維度偏向（橘=偏動/綠=偏靜）<br>內圈面積：先天／運氣／後天（係數÷0.8）</div>
  <div class="card">
    <svg id="poly" viewBox="0 0 400 480" aria-label="一目了然圖"></svg>
    <div class="legend"><span><i style="background:var(--static)"></i>靜</span><span><i style="background:var(--active)"></i>動</span></div>
  </div>
</div>
<script>
function getC(v){return getComputedStyle(document.documentElement).getPropertyValue(v).trim();}
const S=getC('--static'),A=getC('--active'),PRE=getC('--pre'),LUCK=getC('--luck'),POST=getC('--post');
const DIMS=[
  {dn:'形勢',j:2,c:0.29},{dn:'經緯',j:5,c:0.51},{dn:'方圓',j:6,c:0.40},
  {dn:'曲直',j:3,c:0.22},{dn:'收放',j:4,c:0.45},{dn:'緩急',j:7,c:0.38},
  {dn:'順逆',j:5,c:0.30},{dn:'分合',j:3,c:0.33},{dn:'真假',j:6,c:0.41},
  {dn:'攻守',j:2,c:0.55},{dn:'奇正',j:5,c:0.48},{dn:'虛實',j:4,c:0.36},{dn:'進退',j:6,c:0.60}
];
DIMS.forEach(d=>d.d=9-d.j);
const sizes=[30,30,30,30,30,30,30,30,30,22.5,22.5,22.5,22.5];
const spans=[];let acc=0;for(let i=0;i<13;i++){spans.push([acc,acc+sizes[i]]);acc+=sizes[i];}
const mean=a=>a.reduce((s,x)=>s+x,0)/a.length, co=DIMS.map(d=>d.c);
const CORE=[
  {name:'先天',col:PRE, a0:0,a1:180, mid:90, v:mean(co.slice(0,6))},
  {name:'運氣',col:LUCK,a0:180,a1:270,mid:225,v:mean(co.slice(6,9))},
  {name:'後天',col:POST,a0:270,a1:360,mid:315,v:mean(co.slice(9,13))}
];
const COEF_MAX=0.8;
const cx=200,cy=220,U=150/9,rIn=4*U,rOut=9*U;
const rad=d=>d*Math.PI/180;
const f=(deg,r)=>[cx+r*Math.sin(rad(deg)),cy-r*Math.cos(rad(deg))];
const PS=p=>p[0].toFixed(2)+','+p[1].toFixed(2);
function band(a0,a1,rA,rB){
  const bnds=[a0]; spans.forEach(s=>{if(s[0]>a0+0.01&&s[0]<a1-0.01)bnds.push(s[0]);}); bnds.push(a1);
  let outer=bnds.map(a=>PS(f(a,rB)));
  if(rA<=0.5) return `M ${cx},${cy} L ${outer.join(' L ')} Z`;
  let inner=[...bnds].reverse().map(a=>PS(f(a,rA)));
  return `M ${outer.join(' L ')} L ${inner.join(' L ')} Z`;
}
const facet=(a0,a1,ra,rb)=>`M ${PS(f(a0,ra))} L ${PS(f(a0,rb))} L ${PS(f(a1,rb))} L ${PS(f(a1,ra))} Z`;
let svg='';
svg+=`<polygon points="${spans.map(s=>PS(f(s[0],rOut))).join(' ')}" fill="none" stroke="#e6ddd0" stroke-width="1"/>`;
svg+=`<circle cx="${cx}" cy="${cy}" r="${rIn.toFixed(1)}" fill="none" stroke="#e6ddd0" stroke-width="1"/>`;
// 內圈三大係數：面積 = 係數/0.8（r = rIn*sqrt(係數/0.8)）
CORE.forEach(c=>{
  const r=rIn*Math.sqrt(Math.min(1,c.v/COEF_MAX));
  svg+=`<path d="${band(c.a0,c.a1,0,r)}" fill="${c.col}" opacity="0.5"/>`;
  svg+=`<path d="${band(c.a0,c.a1,r,rIn)}" fill="${c.col}" opacity="0.07"/>`;
});
[0,180,270].forEach(a=>svg+=`<line x1="${cx}" y1="${cy}" x2="${f(a,rIn)[0].toFixed(1)}" y2="${f(a,rIn)[1].toFixed(1)}" stroke="#fff" stroke-width="1.5"/>`);
CORE.forEach(c=>{const lp=f(c.mid,rIn*0.62);
  svg+=`<text x="${lp[0].toFixed(1)}" y="${(lp[1]-3).toFixed(1)}" font-size="12" text-anchor="middle" fill="${c.col}" font-weight="700">${c.name}</text>`;
  svg+=`<text x="${lp[0].toFixed(1)}" y="${(lp[1]+13).toFixed(1)}" font-size="13" text-anchor="middle" fill="${c.col}" font-family="monospace" font-weight="700">${c.v.toFixed(2)}</text>`;});
// 外環扇形（綠靜內 / 橘動外）填淡
DIMS.forEach((dm,i)=>{const[a0,a1]=spans[i];const rS=rIn+(dm.j/9)*(rOut-rIn);
  svg+=`<path d="${facet(a0,a1,rIn,rS)}" fill="${S}" fill-opacity="0.45"/>`;
  svg+=`<path d="${facet(a0,a1,rS,rOut)}" fill="${A}" fill-opacity="0.45"/>`;});
// 維度間分隔線
spans.forEach(s=>svg+=`<line x1="${f(s[0],rIn)[0].toFixed(1)}" y1="${f(s[0],rIn)[1].toFixed(1)}" x2="${f(s[0],rOut)[0].toFixed(1)}" y2="${f(s[0],rOut)[1].toFixed(1)}" stroke="#fff" stroke-width="1"/>`);
// 動靜交界線：每維度一段，色＝偏向（動>靜橘／靜>動綠）
DIMS.forEach((dm,i)=>{const[a0,a1]=spans[i];const rS=rIn+(dm.j/9)*(rOut-rIn);
  const col=dm.d>dm.j?A:S; const p0=f(a0,rS),p1=f(a1,rS);
  svg+=`<line x1="${p0[0].toFixed(1)}" y1="${p0[1].toFixed(1)}" x2="${p1[0].toFixed(1)}" y2="${p1[1].toFixed(1)}" stroke="${col}" stroke-width="3.5" stroke-linecap="round"/>`;});
// 維度名+係數
DIMS.forEach((dm,i)=>{const mid=(spans[i][0]+spans[i][1])/2;const lp=f(mid,rOut+16);const c=Math.sin(rad(mid));const an=c>0.25?'start':c<-0.25?'end':'middle';
  svg+=`<text x="${lp[0].toFixed(1)}" y="${lp[1].toFixed(1)}" font-size="12" text-anchor="${an}" fill="var(--text)" font-weight="600">${dm.dn}</text>`;
  svg+=`<text x="${lp[0].toFixed(1)}" y="${(lp[1]+13).toFixed(1)}" font-size="11" text-anchor="${an}" fill="var(--text3)" font-family="monospace">${dm.c.toFixed(2)}</text>`;});
document.getElementById('poly').innerHTML=svg;
</script>
</body>
</html>
