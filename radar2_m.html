<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>報告圖 手機版 試做（radar2_m）</title>
<style>
  :root{--static:#7A9E7E;--active:#C17A5A;--text:#3d3b39;--text3:#9a9188;--bg:#f7f4ef;--card:#fffdfa;--border:#e7ded2;
        --cream-bg:#f0e9dc;--cream-text:#7d6643}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);font-family:'Noto Sans TC','PingFang TC',sans-serif;color:var(--text);padding:14px}
  .wrap{max-width:390px;margin:0 auto}
  .sub{font-size:12px;color:var(--text3);text-align:center;margin:0 0 8px;line-height:1.6}
  .phone{max-width:360px;margin:0 auto;background:var(--card);border:1px solid var(--border);border-radius:14px;padding:8px;box-shadow:0 1px 6px rgba(0,0,0,0.06)}
  svg{display:block;width:100%;height:auto}
  .ctl{margin-top:12px}
  .row{display:flex;align-items:center;gap:8px;font-size:13px;margin:7px 0}
  .row label{flex:0 0 120px;color:var(--text)}
  .row input[type=range]{flex:1}
  .row b{flex:0 0 44px;text-align:right;font-family:monospace;color:var(--active)}
  textarea{width:100%;height:78px;font-family:monospace;font-size:12px;border:1px solid var(--border);border-radius:8px;padding:6px;background:var(--card);color:var(--text);margin-top:8px}
  button{padding:7px 16px;border:1px solid var(--border);border-radius:8px;background:var(--card);font-size:13px;cursor:pointer}
</style>
</head>
<body>
<div class="wrap">
  <div class="sub">報告圖 手機版預覽（寬度模擬手機）<br>已移除 老闆／主管 與 方圓｜曲直 隔線；係數 0.00 維度在中央處放動/靜色標記</div>
  <div class="phone">
    <svg id="poly" viewBox="20 40 360 360" aria-label="報告圖 手機版"></svg>
  </div>
  <div class="ctl">
    <div class="row"><label>維度字大小</label><input id="sName" type="range" min="6" max="18" step="0.5" value="10.8"><b id="vName">10.8</b></div>
    <div class="row"><label>數字大小</label><input id="sNum" type="range" min="6" max="16" step="0.5" value="10.5"><b id="vNum">10.5</b></div>
    <div class="row"><label>先天/運氣/後天框</label><input id="sBox" type="range" min="6" max="18" step="0.5" value="10.5"><b id="vBox">10.5</b></div>
    <div class="row"><label>總係數圖與字</label><input id="sTot" type="range" min="0.6" max="2.5" step="0.05" value="1"><b id="vTot">1.00</b></div>
    <textarea id="out" readonly></textarea>
    <button id="copyBtn">複製設定</button>
    <button id="resetBtn" style="margin-left:6px">歸位</button>
  </div>
</div>
<script>
function getC(v){return getComputedStyle(document.documentElement).getPropertyValue(v).trim();}
const S=getC('--static'),A=getC('--active');
const CRBG=getC('--cream-bg');
// 假數據（與桌機 radar2_test 同步，dim3 曲直 係數 0.00 用來示範動色標記）
const DIMS=[
  {dn:'形勢',j:5,c:0.13},{dn:'經緯',j:1,c:0.29},{dn:'方圓',j:3,c:0.80},
  {dn:'曲直',j:0,c:0.00},{dn:'收放',j:5,c:0.29},{dn:'緩急',j:5,c:0.50},
  {dn:'順逆',j:7,c:0.50},{dn:'分合',j:3,c:0.29},{dn:'真假',j:9,c:0.80},
  {dn:'攻守',j:0,c:0.80},{dn:'奇正',j:4,c:0.50},{dn:'虛實',j:3,c:0.50},{dn:'進退',j:2,c:0.13}
];
DIMS.forEach(d=>d.d=9-d.j);
const DIMTXT=['#4A6B3A','#3A5E54','#6A6458','#7A5A38','#7A4858','#7A6A38','#3A5A7A','#5A4870','#3A6A4A','#3A6B3A','#5A4068','#3A6058','#3A5870'];
const STEP=360/13;
const spans=[];for(let i=0;i<13;i++)spans.push([i*STEP,(i+1)*STEP]);
const mean=a=>a.reduce((s,x)=>s+x,0)/a.length, co=DIMS.map(d=>d.c);
const COEF_MAX=0.8;
const cx=200,cy=215,U=150/9,rIn=4*U,rOut=9*U,H=rOut-rIn;
const rad=d=>d*Math.PI/180;
const f=(deg,r)=>[cx+r*Math.sin(rad(deg)),cy-r*Math.cos(rad(deg))];
const PS=p=>p[0].toFixed(2)+','+p[1].toFixed(2);
const facet=(a0,a1,ra,rb)=>`M ${PS(f(a0,ra))} L ${PS(f(a0,rb))} L ${PS(f(a1,rb))} L ${PS(f(a1,ra))} Z`;
function polySector(a0,a1,r){const k0=Math.round(a0/STEP),k1=Math.round(a1/STEP);let pts=[`${cx},${cy}`];for(let k=k0;k<=k1;k++)pts.push(PS(f(k*STEP,r)));return 'M'+pts.join(' L')+' Z';}
const innerPoly=spans.map(s=>PS(f(s[0],rIn))).join(' ');
const NAMEPOS=[[14.1,2.395],[40.3,2.320],[69.1,2.318],[97.2,2.300],[128.5,2.340],[155.9,2.401],[180.0,2.504],[204.4,2.406],[233.7,2.390],[261.9,2.332],[290.2,2.365],[319.1,2.357],[345.6,2.398]];
const NUMPOS=[[13.8,1.975],[42.6,1.921],[70.4,1.925],[98.2,1.940],[126.6,1.985],[152.6,2.047],[180.0,2.083],[207.4,2.047],[234.3,2.028],[261.2,1.985],[289.7,1.956],[317.6,1.950],[345.6,1.952]];
const preV=mean(co.slice(0,6)), luckV=mean(co.slice(6,9)), postV=mean(co.slice(9,13)), totV=mean(co);
const OP_LOW=0.5, OP_HIGH=0.70, ZERO_MARK=5; // 0分動/靜標記厚度

function lab2(x,y,name,val,fs,col){const tl=(name.length*fs).toFixed(1);
  return `<text x="${x.toFixed(1)}" y="${(y-fs*0.3).toFixed(1)}" font-size="${fs}" text-anchor="middle" fill="${col}" font-weight="700">${name}</text>`
    +`<text x="${x.toFixed(1)}" y="${(y+fs*0.86).toFixed(1)}" font-size="${fs}" textLength="${tl}" lengthAdjust="spacingAndGlyphs" text-anchor="middle" fill="${col}" font-family="'Helvetica Neue',Arial,sans-serif" font-weight="700">${val.toFixed(2)}</text>`;}

function buildSVG(P){
  const fsName=P.fsName, fsNum=P.fsNum, fsBox=P.fsBox, totS=P.totS;
  let svg='';
  svg+=`<polygon points="${innerPoly}" fill="${CRBG}"/>`;
  // 運氣 / 後天 填色扇形（老闆/主管已移除）
  {const r=rIn*Math.sqrt(Math.min(1,luckV/COEF_MAX));svg+=`<path d="${polySector(6*STEP,9*STEP,r)}" fill="#546D77" fill-opacity="0.3"/>`;}
  {const r=rIn*Math.sqrt(Math.min(1,postV/COEF_MAX));svg+=`<path d="${polySector(9*STEP,360,r)}" fill="#797181" fill-opacity="0.3"/>`;}
  // 先天：多邊扇形（0~6格）
  {const r=rIn*Math.sqrt(Math.min(1,preV/COEF_MAX));svg+=`<path d="${polySector(0,6*STEP,r)}" fill="#854F51" fill-opacity="0.3"/>`;}
  // 內圈白色分隔線：只留 先天/運氣/後天 三群組界線（移除 方圓|曲直 那條）
  [[0,1],[6*STEP,1],[9*STEP,1]].forEach(([a,op])=>{const p=f(a,rIn);svg+=`<line x1="${cx}" y1="${cy}" x2="${p[0].toFixed(1)}" y2="${p[1].toFixed(1)}" stroke="#fff" stroke-opacity="${op}" stroke-width="1.5"/>`;});
  svg+=`<polygon points="${innerPoly}" fill="none" stroke="#fff" stroke-width="1.5"/>`;
  // 運氣 / 後天 / 先天 框
  svg+=lab2(f(207.6,rIn*0.767)[0],f(207.6,rIn*0.767)[1],'運氣',luckV,fsBox,'#546D77');
  svg+=lab2(f(302.1,rIn*0.770)[0],f(302.1,rIn*0.770)[1],'後天',postV,fsBox,'#797181');
  svg+=lab2(f(92.4,rIn*0.743)[0],f(92.4,rIn*0.743)[1],'先天',preV,fsBox,'#854F51');
  // 係數環 bar（係數 0 不顯示）
  DIMS.forEach((dm,i)=>{const[a0,a1]=spans[i];const frac=Math.min(1,dm.c/COEF_MAX);const rT=rIn+frac*H;
    const fill=dm.d>dm.j?A:S;const op=(OP_LOW*(1-frac)+OP_HIGH*frac).toFixed(3);
    if(frac>0) svg+=`<path d="${facet(a0,a1,rIn,rT)}" fill="${fill}" fill-opacity="${op}" stroke="#fff" stroke-width="0.8"/>`;});
  // 規則：係數 0.00 → 在中央 0 分處放動/靜色標記
  DIMS.forEach((dm,i)=>{if(dm.c>0)return;const[a0,a1]=spans[i];const fill=dm.d>dm.j?A:S;
    svg+=`<path d="${facet(a0,a1,rIn,rIn+ZERO_MARK)}" fill="${fill}" fill-opacity="0.9" stroke="#fff" stroke-width="0.8"/>`;});
  // 群組分隔線（中心→外緣）：先天/運氣/後天
  [[0,'#854F51',1],[6*STEP,'#546D77',1],[9*STEP,'#797181',1]].forEach(([a,col,op])=>{const p1=f(a,rOut);svg+=`<line x1="${cx}" y1="${cy}" x2="${p1[0].toFixed(1)}" y2="${p1[1].toFixed(1)}" stroke="${col}" stroke-opacity="${op}" stroke-width="2"/>`;});
  // 最外圍淡灰 13 邊形
  svg+=`<polygon points="${spans.map(s=>PS(f(s[0],rOut))).join(' ')}" fill="none" stroke="#e6ddd0" stroke-width="1"/>`;
  // 維度名
  DIMS.forEach((dm,i)=>{const np=NAMEPOS[i];const lp=f(np[0],rIn*np[1]);const c=Math.sin(rad(np[0]));const an=c>0.25?'start':c<-0.25?'end':'middle';
    svg+=`<text x="${lp[0].toFixed(1)}" y="${lp[1].toFixed(1)}" font-size="${fsName}" text-anchor="${an}" fill="${DIMTXT[i]}" fill-opacity="0.8" font-weight="600">${dm.dn}</text>`;});
  // 維度係數數字
  DIMS.forEach((dm,i)=>{const rT=rIn+Math.min(1,dm.c/COEF_MAX)*H;const npp=f(NUMPOS[i][0],rIn*NUMPOS[i][1]);const nx=npp[0],ny=npp[1];
    const rr=Math.hypot(nx-cx,ny-cy);const mcol=dm.d>dm.j?A:S;const ncol=(rT>=rr)?'#fff':mcol;
    svg+=`<text x="${nx.toFixed(1)}" y="${ny.toFixed(1)}" font-size="${fsNum}" text-anchor="middle" fill="${ncol}" font-family="'Helvetica Neue',Arial,sans-serif" font-weight="700">${dm.c.toFixed(2)}</text>`;});
  // 總係數（中央 13 邊形 #494541 白字；整體依 totS 縮放）
  {const rTot=22*totS, lfs=9*totS, vfs=10.5*totS, tl=(21*totS).toFixed(1);
   const tg=spans.map(ss=>PS(f(ss[0],rTot))).join(' ');
   svg+=`<polygon points="${tg}" fill="#494541" fill-opacity="0.92"/>`
     +`<text x="${cx}" y="${(cy-3*totS).toFixed(1)}" font-size="${lfs.toFixed(1)}" text-anchor="middle" fill="#fff">總係數</text>`
     +`<text x="${cx}" y="${(cy+9*totS).toFixed(1)}" font-size="${vfs.toFixed(1)}" textLength="${tl}" lengthAdjust="spacingAndGlyphs" text-anchor="middle" fill="#fff" font-family="'Helvetica Neue',Arial,sans-serif">${totV.toFixed(2)}</text>`;}
  return svg;
}

const poly=document.getElementById('poly');
const sName=document.getElementById('sName'),sNum=document.getElementById('sNum'),sBox=document.getElementById('sBox'),sTot=document.getElementById('sTot');
const vName=document.getElementById('vName'),vNum=document.getElementById('vNum'),vBox=document.getElementById('vBox'),vTot=document.getElementById('vTot');
const DEF={fsName:10.8,fsNum:10.5,fsBox:10.5,totS:1};
function readP(){return{fsName:parseFloat(sName.value),fsNum:parseFloat(sNum.value),fsBox:parseFloat(sBox.value),totS:parseFloat(sTot.value)};}
function render(){
  const P=readP();
  vName.textContent=P.fsName.toFixed(1);vNum.textContent=P.fsNum.toFixed(1);vBox.textContent=P.fsBox.toFixed(1);vTot.textContent=P.totS.toFixed(2);
  poly.innerHTML=buildSVG(P);
  document.getElementById('out').value=
    `維度字大小 = ${P.fsName}\n數字大小 = ${P.fsNum}\n先天/運氣/後天框 = ${P.fsBox}\n總係數圖與字 = ${P.totS}`;
}
[sName,sNum,sBox,sTot].forEach(el=>el.addEventListener('input',render));
document.getElementById('copyBtn').addEventListener('click',function(){const ta=document.getElementById('out');ta.select();try{document.execCommand('copy');}catch(e){}this.textContent='已複製';const b=this;setTimeout(()=>b.textContent='複製設定',1200);});
document.getElementById('resetBtn').addEventListener('click',function(){sName.value=DEF.fsName;sNum.value=DEF.fsNum;sBox.value=DEF.fsBox;sTot.value=DEF.totS;render();});
render();
</script>
</body>
</html>
